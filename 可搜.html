  async function handleImport(file){
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const key = file.name + '::' + (file.size || 0);

    if(importedFiles.has(key)){
      fileStatus.textContent = '已导入过：' + file.name;
      setTimeout(updateFileStatus, 1500);   // 1.5 秒后回到"可搜xxx"
      return;
    }

    fileStatus.textContent = '正在读取：' + file.name;
    showMask('正在读取文件…', file.name);

    try{
      let bookName = null;

      if(ext === 'pdf'){
        bookName = await renderPdf(file);
      } else if(ext === 'json' && file.name.toLowerCase().endsWith('.search.json')){
        bookName = await renderSearchJson(file);
      } else if(ext === 'docx'){
        bookName = await renderDocx(file);
      } else if(ext === 'doc'){
        bookName = await renderLegacyOffice(file, 'doc');
      } else if(ext === 'rtf'){
        bookName = await renderRtf(file);
      } else if(SHEET_EXT.has(ext)){
        bookName = await renderSpreadsheet(file);
      } else if(ext === 'pptx'){
        bookName = await renderPptx(file);
      } else if(ext === 'ppt'){
        bookName = await renderLegacyOffice(file, 'ppt');
      } else if(ext === 'epub'){
        bookName = await renderEpub(file);
      } else if(ext === 'odt'){
        bookName = await renderOdt(file);
      } else if(IMAGE_EXT.has(ext)){
        bookName = await renderImage(file);
      } else {
        // txt / md / csv / json / html 等纯文本类
        bookName = await renderTxt(file);
      }

      if(bookName) registerBookFile(bookName, key);
      importedFiles.add(key);

      render();

    }catch(err){

      fileStatus.textContent = '失败：' + (err.message || '未知错误');
      toast('导入失败：' + (err.message || '未知错误'), 4000);

  }

  /* ============ PDF 解析 ============ */
  async function renderPdf(file){
    showMask('正在加载 PDF 引擎…', file.name);
    await ensurePdfJs();
    if(typeof pdfjsLib === 'undefined') throw new Error('PDF.js 未加载，请检查网络或 lib/ 目录');

    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({
      data: buf,
      cMapUrl: pdfCMapUrl(),
      cMapPacked: true,
      standardFontDataUrl: pdfStandardFontsUrl()
    }).promise;

    // 扫描前 5 页用于检测教材
    let detectText = '';
    const scanMax = Math.min(5, pdf.numPages);
    for(let p=1; p<=scanMax; p++){
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      detectText += tc.items.map(i=>i.str).join('') + '\n';
      if(detectText.length > 4000) break;
    }
    // 严格识别：命中教科书 → 用标准名；否则 → 用文件名
    const bookName = pickBookName(detectText, file);

    const containerWidth = Math.min(window.innerWidth - 16, 900);
    const pdfId = 'pdf_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    pdfStore.set(pdfId, pdf);
    registerBookPdfId(bookName, pdfId);
    // 若 PDF 总数过多，释放最早的一个（防止内存累积）
    if(pdfStore.size > 6){
      const firstKey = pdfStore.keys().next().value;
      pdfStore.delete(firstKey);
      bookPdfIds.forEach(set => set.delete(firstKey));
    }
    const newPageDivs = [];

	// 阶段一：并行建立骨架 + 文本层
	const CONCURRENCY = 4;   // 一次并发处理 4 页
	const pageOrder = [];
	for(let p=1; p<=pdf.numPages; p++) pageOrder.push(p);

	// 批量并发处理
	for(let i=0; i<pageOrder.length; i+=CONCURRENCY){
	  const batch = pageOrder.slice(i, i+CONCURRENCY);
	  updateMask('正在解析 PDF…', `${file.name} 第 ${batch[0]}~${batch[batch.length-1]} / ${pdf.numPages} 页`);

	  await Promise.all(batch.map(async p => {
	    const page = await pdf.getPage(p);
	    const baseVp = page.getViewport({scale: 1});
	    const scale = containerWidth / baseVp.width;
	    const viewport = page.getViewport({scale});

	    const pageDiv = document.createElement('div');
	    pageDiv.className = 'pdf-page';
	    pageDiv.dataset.pageNum = p;
	    pageDiv.dataset.scale = scale;
	    pageDiv.dataset.book = bookName;
	    pageDiv.dataset.pdfId = pdfId;
	    pageDiv.dataset.rendered = '';
	    pageDiv.style.width = viewport.width + 'px';
	    pageDiv.style.height = viewport.height + 'px';

	    const canvas = document.createElement('canvas');
	    canvas.width = 1; canvas.height = 1;
	    canvas.style.width = viewport.width + 'px';
	    canvas.style.height = viewport.height + 'px';
	    canvas.style.background = '#fff';
	    pageDiv.appendChild(canvas);

	    const textLayer = document.createElement('div');
	    textLayer.className = 'text-layer';
	    textLayer.style.width = viewport.width + 'px';
	    textLayer.style.height = viewport.height + 'px';
	    textLayer.style.setProperty('--scale-factor', scale);
	    pageDiv.appendChild(textLayer);

	    // 先把 pageDiv 挂到 DOM 上，但保持顺序需要按 p 插入
	    // 这里先把 DOM 元素存起来，等这一批结束后按顺序插入
	    pageDiv._sortKey = p;

		const tc = await page.getTextContent();

		// ★ 清理 LaTeX 化学式：$Na_{2}O_{2}$ → Na₂O₂
		if(tc && tc.items){
		  for(const it of tc.items){
		    if(it && typeof it.str === 'string'){
		      it.str = cleanLatex(it.str);
		    }
		  }
		}

		// 使用 DocumentFragment 批量构建，减少 DOM 重排
		await pdfjsLib.renderTextLayer({
		  textContentSource: tc,
		  container: textLayer,
		  viewport: viewport,
		  textDivs: []
		}).promise;

	    // 一次遍历完成 span 收集 + 文本索引构建
	    let pageText = '';
	    textLayer.querySelectorAll('span').forEach(s => {
	      searchSpans.push(s);
	      pageText += normalizeForMatch(s.textContent || '');
	    });
	    pageDiv.dataset.normText = pageText;

	    pageDiv._ready = true;
	    pageOrder._results = pageOrder._results || {};
	    pageOrder._results[p] = pageDiv;
	  }));

	  // 按页号顺序插入，保证 DOM 顺序正确
	  batch.forEach(p => {
	    const div = pageOrder._results[p];
	    if(div){
	      pdfList.appendChild(div);
	      delete pageOrder._results[p];
	    }
	  });
	}

	pdfPageCount = pdfList.querySelectorAll('.pdf-page').length;
	const lazyObs = ensureLazyObserver();
	pdfList.querySelectorAll('.pdf-page').forEach(d => lazyObs.observe(d));
	if(pdfList.style.display !== 'none'){
	  setTimeout(renderVisiblePages, 50);
	}
	updateZoomBtns();   // ← 新增
    return bookName;
  }
  

  /* ============ 纯文本类渲染（按行分页，所有格式复用） ============ */
  function normalizePlainText(text){
    return String(text || '')
      .replace(/\r\n?/g, '\n')
      .replace(/\u0000/g, '')
      .replace(/\n{4,}/g, '\n\n\n');
  }

  function renderTextDoc(text, file, options){
    options = options || {};
    const bookName = pickBookName(options.detectText || text.slice(0, 6000), file);
    // 按行分页，每页约 80 行（手机上一屏约 30-50 行，80 行约 2 屏）
    let lines = normalizePlainText(text).split('\n');
    const LINES_PER_PAGE = 80;
    const MAX_LINES = 40000;
    if(lines.length > MAX_LINES){
      lines = lines.slice(0, MAX_LINES);
      lines.push('…（内容过长，仅显示前 ' + MAX_LINES + ' 行）');
    }

    const chunks = [];
    if(lines.length <= LINES_PER_PAGE){
      chunks.push(lines);
    } else {
      for(let i = 0; i < lines.length; i += LINES_PER_PAGE){
        chunks.push(lines.slice(i, i + LINES_PER_PAGE));
      }
    }

    chunks.forEach((chunk, pi)=>{
      const doc = document.createElement('div');
      doc.className = 'txt-doc';
      doc.dataset.book = bookName;
      doc.dataset.kind = options.kind || 'text';
      doc.dataset.pageNum = pi + 1;
      if(chunks.length > 1) doc.style.position = 'relative';

      chunk.forEach(line => {
        const div = document.createElement('div');
        div.className = 'txt-line';
        div.textContent = line || '\u00A0';
        doc.appendChild(div);
        searchSpans.push(div);
      });
      pdfList.appendChild(doc);
    });

    updateZoomBtns();
    return bookName;
  }

  async function readTextSmart(file){
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    const bad = (text.match(/\uFFFD/g) || []).length;
    // UTF-8 解出大量乱码 → 试 GB18030（国内教材 TXT/CSV 常见）
    if(bad > 0 && bad > Math.max(2, text.length * 0.002)){
      try{
        const gb = new TextDecoder('gb18030').decode(buf);
        const badGb = (gb.match(/\uFFFD/g) || []).length;
        if(badGb < bad) text = gb;
      }catch(e){}
    }
    return text.replace(/^\uFEFF/, '');
  }

  /* HTML → 纯文本（保留段落换行） */
  function htmlToText(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script, style, noscript, svg, head').forEach(n => n.remove());
    doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
    doc.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, section, article, blockquote, pre, table')
      .forEach(n => n.appendChild(doc.createTextNode('\n')));
    const body = doc.body || doc.documentElement;
    return body.textContent.replace(/[ \t\u00A0]+/g, ' ').replace(/\n{3,}/g, '\n\n');
  }

  /* ============ TXT / MD / CSV / HTML 等 ============ */
  async function renderTxt(file){
    let text = await readTextSmart(file);
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if(ext === 'html' || ext === 'htm'){
      text = htmlToText(text);
    }
    return renderTextDoc(text, file, {kind: ext});
  }

  /* ============ Word (.docx) ============ */
  async function renderDocx(file){
    showMask('正在解析 Word 文档…', file.name);
    let text = '';
    try{
      await ensureMammoth();
      const result = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
      text = (result && result.value) || '';
    }catch(err){
      console.warn('mammoth 解析失败，改用 XML 提取：', err);
    }

    if(!text.trim()){
      // 兜底：直接解压 word/document.xml 提取段落
      await ensureJSZip();
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const entry = zip.file('word/document.xml');
      if(!entry) throw new Error('不是有效的 .docx 文件');
      const xml = await entry.async('string');
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const ps = doc.getElementsByTagNameNS('*', 'p');
      const lines = [];
      for(const p of ps) lines.push((p.textContent || '').replace(/[ \t\u00A0]+/g, ' '));
      text = lines.join('\n');
    }
    return renderTextDoc(text, file, {kind: 'docx'});
  }

  /* ============ Excel (.xlsx/.xls/.xlsb/.ods) ============ */
  async function renderSpreadsheet(file){
    showMask('正在解析表格…', file.name);
    await ensureXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    const parts = [];
    wb.SheetNames.forEach((name, idx)=>{
      parts.push(`【工作表 ${idx + 1}：${name}】`);
      const ws = wb.Sheets[name];
      let csv = '';
      try{
        csv = XLSX.utils.sheet_to_csv(ws, {blankrows: false, FS: ' | '});
      }catch(e){}
      parts.push(csv.trim() ? csv : '(空工作表)');
      parts.push('');
    });
    if(!parts.length) throw new Error('表格中没有可读取的内容');
    return renderTextDoc(parts.join('\n'), file, {
      kind: 'sheet',
      detectText: (file.name + '\n' + parts.join('\n')).slice(0, 8000)
    });
  }

  /* ============ PowerPoint (.pptx) ============ */
  async function renderPptx(file){
    showMask('正在解析 PPT…', file.name);
    await ensureJSZip();
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const slideNames = Object.keys(zip.files)
      .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a, b) => (+a.match(/slide(\d+)\.xml$/)[1]) - (+b.match(/slide(\d+)\.xml$/)[1]));
    if(!slideNames.length) throw new Error('PPT 中没有找到幻灯片');

    const parts = [];
    for(const name of slideNames){
      const num = +name.match(/slide(\d+)\.xml$/)[1];
      parts.push(`【第 ${num} 张幻灯片】`);
      const xml = await zip.file(name).async('string');
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      let paras = doc.getElementsByTagName('a:p');
      if(!paras.length) paras = doc.getElementsByTagNameNS('*', 'p');
      const lines = [];
      for(const p of paras){
        let ts = p.getElementsByTagName('a:t');
        if(!ts.length) ts = p.getElementsByTagNameNS('*', 't');
        let line = '';
        for(const t of ts) line += t.textContent || '';
        line = line.replace(/[ \t\u00A0]+/g, ' ').trim();
        if(line) lines.push(line);
      }
      if(!lines.length){
        const ts = doc.getElementsByTagName('a:t');
        for(const t of ts){
          const v = (t.textContent || '').trim();
          if(v) lines.push(v);
        }
      }
      parts.push(lines.join('\n') || '(空白幻灯片)');
      parts.push('');
    }
    return renderTextDoc(parts.join('\n'), file, {
      kind: 'pptx',
      detectText: (file.name + '\n' + parts.join('\n')).slice(0, 8000)
    });
  }

  /* ============ 旧版 .doc / .ppt（二进制，尽力提取） ============ */
  function extractReadableRuns(text){
    const out = [];
    const seen = new Set();
    const META_RE = /^(Normal\b|Default Paragraph Font|Root Entry\b|WordDocument\b|[01]Table\b|SummaryInformation\b|DocumentSummaryInformation\b|CompObj\b|ObjectPool\b|PowerPoint Document\b|Current User\b|Pictures\b|Ole\b|Microsoft (Word|Excel|PowerPoint)\b|Times New Roman\b|Arial\b|Symbol\b|Wingdings\b|Calibri\b|Cambria\b|Helvetica\b|Courier\b)/i;
    const re = /[\u4e00-\u9fff\u3400-\u4dbf\u3000-\u303f\uff00-\uffefA-Za-z0-9][\u4e00-\u9fff\u3400-\u4dbf\u3000-\u303f\uff00-\uffefA-Za-z0-9\s.,;:!?，。；：！？、（）()\[\]{}<>《》“”"'\-+/=%×÷°·…—]{2,}/g;
    let m;
    while((m = re.exec(text))){
      let s = m[0].replace(/[\r\v\f\u2000-\u200f]+/g, '\n').trim();
      if(s.length < 2 || seen.has(s)) continue;
      // 遇到 OLE 目录/字体等元数据即停止，避免把文件名、字体名当正文
      if(META_RE.test(s)) break;
      // 过滤掉大量无意义符号串
      if(!/[\u4e00-\u9fffA-Za-z]{2,}/.test(s)) continue;
      seen.add(s);
      out.push(s);
    }
    return out.join('\n');
  }
  async function renderLegacyOffice(file, kind){
    showMask('正在解析旧版 Office 文件…', file.name);
    const buf = new Uint8Array(await file.arrayBuffer());
    let best = '';
    try{
      const u16 = new TextDecoder('utf-16le').decode(buf);
      best = extractReadableRuns(u16);
    }catch(e){}
    // Word/PowerPoint 97 的正文通常是 UTF-16LE；只有完全提不出内容时才试 GB18030
    if(best.trim().length < 2){
      try{
        const gb = new TextDecoder('gb18030').decode(buf);
        const alt = extractReadableRuns(gb);
        if(alt.length > best.length) best = alt;
      }catch(e){}
    }
    if(!best.trim()){
      throw new Error('无法解析该旧版 ' + (kind === 'doc' ? '.doc' : '.ppt') + ' 文件，请另存为 .' + (kind === 'doc' ? 'docx' : 'pptx'));
    }
    const tip = '※ 旧版 .' + kind + ' 为二进制格式，以下为尽力提取的文字，排版可能不完整。建议用 Office 另存为 .' + (kind === 'doc' ? 'docx' : 'pptx') + ' 后重新导入。';
    return renderTextDoc(tip + '\n\n' + best, file, {
      kind,
      detectText: (file.name + '\n' + best).slice(0, 8000)
    });
  }

  /* ============ RTF ============ */
  function rtfToText(input){
    const s = String(input || '');
    let out = '';
    let i = 0;
    let skip = false;          // 当前组是否忽略
    const stack = [];          // 进入组前的 skip 状态
    let bytes = [];
    // 这些目标组（字体表、样式表、图片等）不输出文字
    const SKIP_DESTS = new Set([
      'fonttbl','colortbl','stylesheet','info','pict','header','footer','headerl','headerr',
      'footerl','footerr','listtable','listoverridetable','rsidtbl','generator','xmlnstbl',
      'themedata','colorschememapping','datastore','latentstyles','filetbl','revtbl','pn',
      'object','objdata','shppict','nonshppict','field','fldinst','bkmkstart','bkmkend'
    ]);

    const flushBytes = ()=>{
      if(!bytes.length) return;
      const arr = new Uint8Array(bytes);
      let str = '';
      try{ str = new TextDecoder('gb18030').decode(arr); }
      catch(e){ str = Array.from(arr).map(b => String.fromCharCode(b)).join(''); }
      out += str;
      bytes = [];
    };

    while(i < s.length){
      const ch = s[i];
      if(ch === '{'){
        stack.push(skip);
        i++;
        continue;
      }
      if(ch === '}'){
        flushBytes();
        skip = stack.length ? stack.pop() : false;
        i++;
        continue;
      }
      if(ch === '\\'){
        const next = s[i + 1];
        if(next === '*'){
          skip = true;
          i += 2;
          continue;
        }
        if(next === '\''){
          const hex = s.substr(i + 2, 2);
          if(!skip) bytes.push(parseInt(hex, 16) || 0);
          i += 4;
          continue;
        }
        if(next === '\\' || next === '{' || next === '}'){
          if(!skip){ flushBytes(); out += next; }
          i += 2;
          continue;
        }
        if(next === '~'){ if(!skip){ flushBytes(); out += ' '; } i += 2; continue; }
        if(next === '\n' || next === '\r'){ if(!skip){ flushBytes(); out += '\n'; } i += 2; continue; }
        if(next === undefined) break;

        let j = i + 1;
        while(j < s.length && /[a-z]/i.test(s[j])) j++;
        const word = s.slice(i + 1, j).toLowerCase();
        let num = '';
        if(s[j] === '-'){ num += '-'; j++; }
        while(j < s.length && /[0-9]/.test(s[j])){ num += s[j]; j++; }
        if(s[j] === ' '){ j++; }

        if(SKIP_DESTS.has(word)) skip = true;

        if(!skip){
          flushBytes();
          if(word === 'par' || word === 'line' || word === 'sect' || word === 'row') out += '\n';
          else if(word === 'tab' || word === 'cell') out += '\t';
          else if(word === 'u' && num){
            let code = parseInt(num, 10);
            if(code < 0) code += 65536;
            out += String.fromCharCode(code);
            // 跳过 \uN 后面的替代字符（通常是 ?）
            if(s[j] === '?') j++;
          }
        }
        i = j;
        continue;
      }
      if(ch === '\r' || ch === '\n'){ i++; continue; }
      if(!skip){ flushBytes(); out += ch; }
      i++;
    }
    flushBytes();
    return out;
  }
  async function renderRtf(file){
    const raw = await readTextSmart(file);
    const text = rtfToText(raw);
    if(!text.trim()) throw new Error('RTF 中没有可读取的文字');
    return renderTextDoc(text, file, {kind: 'rtf'});
  }

  /* ============ EPUB / ODT ============ */
  function zipResolvePath(base, href){
    if(!href) return '';
    if(href.startsWith('/')) return href.slice(1);
    const parts = (base + href).split('/');
    const out = [];
    for(const p of parts){
      if(p === '..') out.pop();
      else if(p !== '.' && p !== '') out.push(p);
    }
    return out.join('/');
  }

  async function renderEpub(file){
    showMask('正在解析 EPUB…', file.name);
    await ensureJSZip();
    const zip = await JSZip.loadAsync(await file.arrayBuffer());

    let opfPath = '';
    const containerEntry = zip.file('META-INF/container.xml');
    if(containerEntry){
      const cdoc = new DOMParser().parseFromString(await containerEntry.async('string'), 'application/xml');
      const rootfile = cdoc.getElementsByTagName('rootfile')[0];
      if(rootfile) opfPath = rootfile.getAttribute('full-path') || '';
    }
    if(!opfPath){
      opfPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.opf')) || '';
    }
    if(!opfPath) throw new Error('不是有效的 EPUB 文件');

    const opfXml = await zip.file(opfPath).async('string');
    const opf = new DOMParser().parseFromString(opfXml, 'application/xml');
    const baseDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';

    const manifest = {};
    for(const item of opf.getElementsByTagName('item')){
      const id = item.getAttribute('id');
      if(id) manifest[id] = item.getAttribute('href') || '';
    }
    const spineIds = [...opf.getElementsByTagName('itemref')]
      .map(x => x.getAttribute('idref'))
      .filter(Boolean);

    const parts = [];
    for(const id of spineIds){
      const href = manifest[id];
      if(!href || /\.(css|js)$/i.test(href)) continue;
      const path = zipResolvePath(baseDir, href);
      const entry = zip.file(path) || zip.file(decodeURIComponent(path));
      if(!entry) continue;
      let html = await entry.async('string');
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script, style, svg, nav').forEach(n => n.remove());
      doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
      doc.querySelectorAll('p, div, h1, h2, h3, h4, h5, h6, li, blockquote, pre, section, article')
        .forEach(n => n.appendChild(doc.createTextNode('\n')));
      const text = (doc.body ? doc.body.textContent : '')
        .replace(/[ \t\u00A0]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      if(text) parts.push(text);
    }
    if(!parts.length) throw new Error('EPUB 中没有可读取的文字');
    return renderTextDoc(parts.join('\n\n'), file, {kind: 'epub'});
  }

  async function renderOdt(file){
    showMask('正在解析 ODT…', file.name);
    await ensureJSZip();
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const entry = zip.file('content.xml');
    if(!entry) throw new Error('不是有效的 .odt 文件');
    const doc = new DOMParser().parseFromString(await entry.async('string'), 'application/xml');
    // 按文档顺序取所有 text:p / text:h（避免命名空间选择器兼容问题）
    const nodes = [...doc.getElementsByTagName('*')]
      .filter(el => el.localName === 'p' || el.localName === 'h');
    let lines = [];
    if(nodes.length){
      lines = nodes.map(n => (n.textContent || '').replace(/[ \t\u00A0]+/g, ' '));
    } else {
      lines = (doc.documentElement.textContent || '').split(/\n+/);
    }
    const text = lines.join('\n');
    if(!text.trim()) throw new Error('ODT 中没有可读取的文字');
    return renderTextDoc(text, file, {kind: 'odt'});
  }

  /* ============ 图片 ============ */
  async function renderImage(file){
    const bookName = pickBookName('', file);
    const url = URL.createObjectURL(file);

    const pageDiv = document.createElement('div');
    pageDiv.className = 'pdf-page img-doc';
    pageDiv.dataset.book = bookName;
    pageDiv.dataset.kind = 'image';
    pageDiv.dataset.pageNum = 1;

    const img = document.createElement('img');
    img.alt = file.name;
    img.draggable = false;
    img.src = url;
    pageDiv.appendChild(img);

    const tip = document.createElement('div');
    tip.className = 'img-tip';
    tip.textContent = '图片文档（不支持文字搜索）';
    pageDiv.appendChild(tip);

    pdfList.appendChild(pageDiv);

    await new Promise(resolve=>{
      img.onload = resolve;
      img.onerror = resolve;
      setTimeout(resolve, 12000);   // 兜底
    });

    const maxW = Math.min(window.innerWidth - 16, 1400);
    if(img.naturalWidth){
      const w = Math.min(maxW, img.naturalWidth);
      img.style.width = w + 'px';
      img.style.height = 'auto';
      pageDiv.style.width = w + 'px';
      pageDiv.style.height = 'auto';
    } else {
      // 浏览器不支持该图片格式（如部分 HEIC）
      tip.textContent = '无法显示该图片格式';
      img.removeAttribute('src');
      try{ URL.revokeObjectURL(url); }catch(e){}
    }

    pdfPageCount = pdfList.querySelectorAll('.pdf-page').length;
    updateZoomBtns();
    return bookName;
  }

  /* ============ 搜索数据包（.search.json）渲染 ============ */
  async function renderSearchJson(file){
    const text = await file.text();
    let data;
    try{
      data = JSON.parse(text);
    }catch(e){
      throw new Error('JSON 解析失败: ' + e.message);
    }

    if(data.format !== 'searchable-v1'){
      throw new Error('不支持的 JSON 格式: ' + (data.format || '未知'));
    }

    // 注册教材名
    const base = data.title || file.name.replace(/\.search\.json$/i, '');
    let bookName = base;
    let n = 0;
    while(BOOKS.includes(bookName)){
      n++;
      bookName = base + '.' + n;
    }
    BOOKS.push(bookName);
    buildChips();

    // 清掉相同 bookName 的旧页（防止重复导入）
    pdfList.querySelectorAll(`.pdf-page[data-book="${CSS.escape(bookName)}"]`)
           .forEach(el => el.remove());

    // 渲染每页
    for(const pg of data.pages){
      const pageDiv = document.createElement('div');
      pageDiv.className = 'pdf-page';
      pageDiv.dataset.book = bookName;
      pageDiv.dataset.pageNum = pg.page_num + 1;
      pageDiv.dataset.rendered = '1';
      pageDiv.dataset.sharp = '1';
      pageDiv.style.width = pg.width + 'px';
      pageDiv.style.height = pg.height + 'px';

      // 页面图像
      const img = document.createElement('img');
      img.src = pg.image;
      img.style.cssText =
        'display:block;width:100%;height:100%;user-select:none;pointer-events:none;';
      img.draggable = false;
      pageDiv.appendChild(img);

      // 文本层
      const textLayer = document.createElement('div');
      textLayer.className = 'text-layer';
      textLayer.style.width = pg.width + 'px';
      textLayer.style.height = pg.height + 'px';

	  /* 在 renderSearchJson 函数中，处理 lines 数组的部分修改为： */
	  for(const line of pg.lines){
	    const span = document.createElement('span');
	    span.textContent = line.text;
	    // 字符级高亮：每个字符单独定位
	    span.style.cssText =
	      `position:absolute;left:${line.x}px;top:${line.y}px;` +
	      `width:${line.w}px;height:${line.h}px;` +
	      `color:transparent;background:transparent;` +
	      `font-size:${Math.max(6, line.h * 0.9)}px;` + // 字号适配
	      `line-height:1;white-space:pre;overflow:hidden;` +
	      `pointer-events:auto;cursor:text;`;
	    textLayer.appendChild(span);
	    searchSpans.push(span);
	  }
	  // ★ 构建归一化文本，供"全部"视图统计与快速路径使用
	  let normText = '';
	  for(const line of pg.lines){
	    normText += normalizeForMatch(line.text || '');
	  }
	  pageDiv.dataset.normText = normText;
      pageDiv.appendChild(textLayer);
      pdfList.appendChild(pageDiv);
    }

    pdfPageCount = (pdfPageCount || 0) + data.pages.length;
    if(typeof updateZoomBtns === 'function') updateZoomBtns();
    return bookName;
  }


  /* 兼容旧调用：FileReader 文本读取（UTF-8） */
  function readAsText(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = ()=> reject(new Error('文件读取失败'));
      r.readAsText(file, 'UTF-8');
    });
  }

  /* ---- 拖拽文件到页面即可导入 ---- */
  let dragDepth = 0;
  window.addEventListener('dragenter', (e)=>{
    if(!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    document.body.style.outline = '3px dashed #2E7D32';
    document.body.style.outlineOffset = '-6px';
  });
  window.addEventListener('dragover', (e)=>{
    if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
  window.addEventListener('dragleave', ()=>{
    if(dragDepth > 0) dragDepth--;
    if(dragDepth === 0) document.body.style.outline = '';
  });
  window.addEventListener('drop', async (e)=>{
    if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    dragDepth = 0;
    document.body.style.outline = '';
    const files = Array.from(e.dataTransfer.files);
    for(const f of files) await handleImport(f);
  });
})();

/* ==================== PWA：安装到主屏幕 + 离线缓存 ==================== */
(function(){
  const installBtn = document.getElementById('installBtn');
  let deferredPrompt = null;

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                       navigator.standalone === true;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Mac') && 'ontouchend' in document);
  const isSafari = /Safari/.test(ua) && !/Chrome|CriOS|Edg|OPR|Firefox|FxiOS/.test(ua);

  if(installBtn && !isStandalone && isIOS && isSafari){
    installBtn.style.display = '';
    installBtn.onclick = ()=>{
      alert('在 iPhone / iPad 上安装「可搜」：\n\n1. 用 Safari 打开本页面\n2. 点底部「分享」按钮\n3. 选择「添加到主屏幕」\n4. 点右上角「添加」\n\n之后从主屏幕图标打开即可全屏使用。');
    };
  }

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    if(!installBtn || isStandalone) return;
    installBtn.style.display = '';
    installBtn.onclick = async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      try{ await deferredPrompt.userChoice; }catch(err){}
      deferredPrompt = null;
      installBtn.style.display = 'none';
    };
  });
  window.addEventListener('appinstalled', ()=>{
    if(installBtn) installBtn.style.display = 'none';
    toast('已安装到主屏幕');
  });

  // file:// 下浏览器不允许注册 Service Worker；请用本地服务器或 https 打开
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(err=>{
        console.warn('Service Worker 注册失败：', err);
      });
    });
  }
})();

/* ==================== 首次加载遮罩：页面/字体/离线缓存就绪后再显示 ==================== */
(function(){
  const overlay = document.getElementById('bootOverlay');
  const statusEl = document.getElementById('bootStatus');
  if(!overlay) return;

  document.body.classList.add('boot-loading');
  const wait = ms => new Promise(resolve=>setTimeout(resolve, ms));
  const setStatus = text => { if(statusEl) statusEl.textContent = text; };

  function waitForLoad(){
    if(document.readyState === 'complete') return Promise.resolve();
    return new Promise(resolve=>window.addEventListener('load', resolve, {once:true}));
  }

  async function boot(){
    let swSlow = false;
    try{
      setStatus('正在加载页面资源…');
      // 资源很慢时也不无限卡住；20 秒后先放行
      await Promise.race([waitForLoad(), wait(20000)]);

      setStatus('正在准备字体…');
      if(document.fonts && document.fonts.ready){
        await Promise.race([document.fonts.ready.catch(()=>{}), wait(3000)]);
      }

      if('serviceWorker' in navigator && location.protocol !== 'file:'){
        setStatus('正在准备离线缓存…');
        try{
          const reg = await Promise.race([
            navigator.serviceWorker.getRegistration(),
            wait(1200).then(()=>null)
          ]);
          if(!reg) setStatus('正在注册离线缓存…');

          const ready = await Promise.race([
            navigator.serviceWorker.ready.then(()=>true).catch(()=>true),
            wait(15000).then(()=>false)
          ]);
          if(!ready){
            swSlow = true;
            setStatus('离线缓存将在后台继续…');
          }
        }catch(e){}
      }

      if(!swSlow) setStatus('准备就绪');
      await wait(180);
    }catch(err){
      console.warn('首次加载提示：', err);
    }finally{
      overlay.classList.add('hide');
      document.body.classList.remove('boot-loading');
      setTimeout(()=>{ if(overlay.parentNode) overlay.remove(); }, 500);
    }
  }

  boot();
})();
