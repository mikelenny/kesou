<style>
	/* ================= 结构式放大浮层 ================= */
	#svgZoomOverlay{
	  position:fixed; inset:0;
	  background:rgba(28,16,36,.75);
	  z-index:300;
	  display:none;
	  align-items:center; justify-content:center;
	  cursor:zoom-out;
	  animation:fadeIn .18s ease;
	}
	#svgZoomOverlay.show{ display:flex; }
	#svgZoomOverlay .zoom-box{
	  background:transparent;
	  border-radius:0;
	  padding:0;
	  max-width:none;
	  max-height:none;
	  display:flex;
	  flex-direction:column;
	  align-items:center;
	  justify-content:center;
	  overflow:visible;
	  box-shadow:none;
	  cursor:default;
	  animation:zoomIn .2s ease;
	}
	#svgZoomOverlay .svg-zoom-inner{
	  background:#fff;
	  border-radius:12px;
	  padding:20px;
	  box-sizing:border-box;
	  box-shadow:0 12px 40px rgba(0,0,0,.35);
	  display:flex;
	  align-items:center;
	  justify-content:center;
	}
	#svgZoomOverlay .svg-zoom-inner svg{
	  display:block;
	  max-width:none;
	  max-height:none;
	}
	#svgZoomOverlay .zoom-hint{
	  text-align:center;
	  font-size:13px;
	  color:#fff;
	  background:rgba(28,16,36,.75);
	  padding:4px 14px;
	  border-radius:999px;
	  margin-top:12px;
	  flex-shrink:0;
	}
	@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
	@keyframes zoomIn{ from{transform:scale(.9);opacity:.6} to{transform:scale(1);opacity:1} }

}

.text-layer{

  pointer-events:auto;
}

  position:absolute;
  white-space:pre;

}

<script>
'use strict';

/* ==================== 离线依赖加载（本地优先 → CDN 兜底） ==================== */
const LIB_BASE = './lib/';
const PDFJS_VERSION = '3.11.174';
const PDFJS_CDN = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
const CDN_LIBS = {
  jszip:   'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  xlsx:    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js',
};
let pdfAssetSource = 'local';
let pdfReadyPromise = null;

function loadScriptOnce(id, localSrc, cdnSrc){
  const existing = document.getElementById(id);
  if(existing && existing.dataset.loaded === '1') return Promise.resolve(existing.dataset.source);
  return new Promise((resolve, reject)=>{
    const tryLoad = (src, source, next)=>{
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.id = id;
      s.dataset.source = source;
      s.onload = ()=>{ s.dataset.loaded = '1'; resolve(source); };
      s.onerror = ()=>{ s.remove(); next(); };
      document.head.appendChild(s);
    };
    tryLoad(localSrc, 'local', ()=>{
      tryLoad(cdnSrc, 'cdn', ()=> reject(new Error('依赖加载失败：' + id + '（本地与 CDN 均不可用）')));
    });
  });
}

function localUrl(p){
  try{ return new URL(p, location.href).href; }catch(e){ return p; }
}

async function ensurePdfJs(){
  if(typeof pdfjsLib !== 'undefined') return;
  if(!pdfReadyPromise){
    pdfReadyPromise = (async()=>{
      pdfAssetSource = await loadScriptOnce('lib-pdfjs', LIB_BASE + 'pdf.min.js', PDFJS_CDN + 'build/pdf.min.js');
      const base = pdfAssetSource === 'local' ? localUrl(LIB_BASE) : PDFJS_CDN + 'build/';
      try{ pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; }catch(e){}
    })();
  }
  return pdfReadyPromise;
}
function pdfCMapUrl(){
  return pdfAssetSource === 'local' ? localUrl(LIB_BASE + 'cmaps/') : PDFJS_CDN + 'cmaps/';
}
function pdfStandardFontsUrl(){
  return pdfAssetSource === 'local' ? localUrl(LIB_BASE + 'standard_fonts/') : PDFJS_CDN + 'standard_fonts/';
}

let jszipPromise = null;
function ensureJSZip(){
  if(typeof JSZip !== 'undefined') return Promise.resolve();
  if(!jszipPromise){
    jszipPromise = loadScriptOnce('lib-jszip', LIB_BASE + 'jszip.min.js', CDN_LIBS.jszip).catch(err=>{
      jszipPromise = null; throw err;
    });
  }
  return jszipPromise;
}
let xlsxPromise = null;
function ensureXLSX(){
  if(typeof XLSX !== 'undefined') return Promise.resolve();
  if(!xlsxPromise){
    xlsxPromise = loadScriptOnce('lib-xlsx', LIB_BASE + 'xlsx.full.min.js', CDN_LIBS.xlsx).catch(err=>{
      xlsxPromise = null; throw err;
    });
  }
  return xlsxPromise;
}
let mammothPromise = null;
function ensureMammoth(){
  if(typeof mammoth !== 'undefined') return Promise.resolve();
  if(!mammothPromise){
    mammothPromise = loadScriptOnce('lib-mammoth', LIB_BASE + 'mammoth.browser.min.js', CDN_LIBS.mammoth).catch(err=>{
      mammothPromise = null; throw err;
    });
  }
  return mammothPromise;
}

function toast(msg, ms){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;

const SYNONYM_MAP = new Map();
SYNONYM_GROUPS.forEach(group => {
  group.forEach(word => {
    const lower = word.toLowerCase();
    if(!SYNONYM_MAP.has(lower)){
      SYNONYM_MAP.set(lower, new Set());
    }
    group.forEach(w => {
      const wLower = w.toLowerCase();
      if(wLower !== lower){
        SYNONYM_MAP.get(lower).add(wLower);
      }
    });
  });
});

    enableSharp: !lowMem,

/* 空闲任务队列：不阻塞交互 */
const idleQueue = [];
let idleScheduled = false;
function scheduleIdle(fn){
  idleQueue.push(fn);
  if(idleScheduled) return;
  idleScheduled = true;

  const step = async ()=>{
    if(!idleQueue.length){ idleScheduled = false; return; }
    const f = idleQueue.shift();
    try{ await f(); }catch(e){ console.error(e); }
    // 每个任务后让出主线程，UI 不卡
    setTimeout(step, 0);
  };
  setTimeout(step, 0);
}

/* ============ 页面加载提示（新增） ============ */
function showPageLoading(div){
  if(!div) return;
  let loader = div.querySelector('.page-loading');
  if(!loader){
    loader = document.createElement('div');
    loader.className = 'page-loading';
    loader.textContent = '加载中，请稍后…';
    div.appendChild(loader);
  }
  loader.classList.add('show');
}
function hidePageLoading(div){
  if(!div) return;
  const loader = div.querySelector('.page-loading');
  if(loader) loader.classList.remove('show');
}

/* 调度高清升级：任何位置完成快速渲染后都可调用 */
function scheduleSharpUpgrade(div){
  if(div.dataset.sharp === '1') return;

  if(!DEVICE.enableSharp){
    div.dataset.sharp = '1';
    hidePageLoading(div);
    return;
  }

  scheduleIdle(async ()=>{
    if(div.dataset.sharp === '1'){ hidePageLoading(div); return; }
    if(div.dataset.rendered !== '1') return;

    // 已滚远就不升级（保留 pending 状态，滚回来会由 upgradeVisiblePages 重新调度）
    const r = div.getBoundingClientRect();
    if(r.bottom < -600 || r.top > window.innerHeight + 600){
      hidePageLoading(div);
      return;
    }

    // 立刻显示“加载中，请稍后…”提示（不延迟）
    showPageLoading(div);

    try{
      const pdf = pdfStore.get(div.dataset.pdfId);
      if(!pdf) return;
      const pageNum = parseInt(div.dataset.pageNum, 10);
      const scale = parseFloat(div.dataset.scale);
      const pg = await pdf.getPage(pageNum);
      const canvas = div.querySelector('canvas');
      // zoom 越大，DPR 越高，避免放大后模糊；上限 2.0
      const zoomFactor = Math.max(1, Math.sqrt(pdfZoom));
      const dpr = Math.min(4.0, Math.min(window.devicePixelRatio || 1, DEVICE.sharpDpr) * zoomFactor);
      const svp = pg.getViewport({scale: scale * dpr});
      canvas.width = Math.floor(svp.width);
      canvas.height = Math.floor(svp.height);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      await pg.render({canvasContext: ctx, viewport: svp}).promise;
      div.dataset.sharp = '1';
    }catch(e){
      console.warn('Sharp upgrade failed', div.dataset.pageNum, e);
    }finally{
      hidePageLoading(div);
    }
  });
}

/* ==================== 懒渲染（全局单例 + 预渲染相邻页） ==================== */
function ensureLazyObserver(){
  if(pdfLazyObserver) return pdfLazyObserver;
  pdfLazyObserver = new IntersectionObserver(async (entries)=>{
	  if(pdfList.style.display === 'none') return; 
    // 按到视口中心的距离排序，先渲染最靠近的
    const list = entries.filter(e=>e.isIntersecting)
      .sort((a,b)=>{
        const av = a.boundingClientRect;
        const bv = b.boundingClientRect;
        const ac = Math.abs((av.top + av.bottom) / 2 - window.innerHeight / 2);
        const bc = Math.abs((bv.top + bv.bottom) / 2 - window.innerHeight / 2);
        return ac - bc;
      });

    for(const entry of list){
      const div = entry.target;
      if(div.dataset.rendered === '1' || div.dataset.rendering === '1') continue;
      div.dataset.rendering = '1';
      const pdf = pdfStore.get(div.dataset.pdfId);
      if(!pdf){ div.dataset.rendering = ''; continue; }
      const p = parseInt(div.dataset.pageNum, 10);
      const scale = parseFloat(div.dataset.scale);

      // 立即显示加载提示
      showPageLoading(div);

      try{
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({scale});
        const canvas = div.querySelector('canvas');

        // 第一步：低分辨率快速渲染，首屏立现
        const fastDpr = DEVICE.fastDpr;
        const fastVp = page.getViewport({scale: scale * fastDpr});
        canvas.width = Math.floor(fastVp.width);
        canvas.height = Math.floor(fastVp.height);
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';
        const fastCtx = canvas.getContext('2d', { willReadFrequently: true });
        await page.render({canvasContext: fastCtx, viewport: fastVp}).promise;

        div.dataset.rendered = '1';
        div.dataset.rendering = '';
        div.dataset.sharp = '0';

        // 第二步：空闲时升级为高分辨率（内部会隐藏加载提示）
        if(DEVICE.enableSharp){
          scheduleSharpUpgrade(div);
        } else {
          div.dataset.sharp = '1';
          hidePageLoading(div);
        }

        // 相邻页预渲染（仅高性能设备启用）
        if(DEVICE.enableAdjacent){
          preRenderAdjacent(div, +1);
          preRenderAdjacent(div, -1);
        }
      }catch(e){
        console.error('Page render failed', div.dataset.pdfId, p, e);
        div.dataset.rendering = '';
        hidePageLoading(div);
      }
    }
    }, {rootMargin: DEVICE.rootMargin + 'px 0px'});
  return pdfLazyObserver;
}

/* 预渲染相邻页：静默触发 observer 无法提前处理的情况 */
function preRenderAdjacent(div, delta){
  const num = parseInt(div.dataset.pageNum, 10) + delta;
  if(num < 1) return;
  const pdfId = div.dataset.pdfId;
  const next = pdfList.querySelector(
    `.pdf-page[data-pdf-id="${pdfId}"][data-page-num="${num}"]`
  );
  if(!next) return;
  if(next.dataset.rendered === '1' || next.dataset.rendering === '1') return;
  next.dataset.rendering = '1';
  const pdf = pdfStore.get(pdfId);
  if(!pdf){ next.dataset.rendering = ''; return; }
  const scale = parseFloat(next.dataset.scale);
  // 使用 setTimeout(0) 让主线程先完成当前工作
  setTimeout(async ()=>{
    try{
        const page = await pdf.getPage(num);
        const viewport = page.getViewport({scale});
        const canvas = next.querySelector('canvas');
        const dpr = Math.min(window.devicePixelRatio || 1, DEVICE.fastDpr);
        const svp = page.getViewport({scale: scale * dpr});
        canvas.width = Math.floor(svp.width);
        canvas.height = Math.floor(svp.height);
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        await page.render({canvasContext: ctx, viewport: svp}).promise;
        next.dataset.rendered = '1';
        next.dataset.rendering = '';
        next.dataset.sharp = '0';
        // 调度高清升级（关键！）
        scheduleSharpUpgrade(next);
    }catch(e){
      console.error('Pre-render failed', num, e);
      next.dataset.rendering = '';
    }
  }, 0);
}

/* 主动补渲染：视口附近的未渲染页面强制渲染（兜底） */
function renderVisiblePages(){
  if(!pdfList || pdfList.style.display === 'none') return;   // ★ 关键：隐藏时不渲染
  const pages = pdfList.querySelectorAll('.pdf-page');
  const vh = window.innerHeight;
  const vw = window.innerWidth;
  pages.forEach(p=>{
    if(p.dataset.rendered === '1' || p.dataset.rendering === '1') return;
    const r = p.getBoundingClientRect();
    if(r.top < vh + DEVICE.fallbackMargin && r.bottom > -DEVICE.fallbackMargin){
      p.dataset.rendering = '1';
      p.dataset.renderedVisible = '1';   // ★ 记录：渲染时容器是可见的
      const pdf = pdfStore.get(p.dataset.pdfId);
      if(!pdf){ p.dataset.rendering = ''; return; }
      const num = parseInt(p.dataset.pageNum, 10);
      const scale = parseFloat(p.dataset.scale);

      showPageLoading(p);

      setTimeout(async ()=>{
        try{
          const page = await pdf.getPage(num);
          const viewport = page.getViewport({scale});
          const canvas = p.querySelector('canvas');
          const dpr = Math.min(window.devicePixelRatio || 1, DEVICE.fastDpr);
          const svp = page.getViewport({scale: scale * dpr});
          canvas.width = Math.floor(svp.width);
          canvas.height = Math.floor(svp.height);
          canvas.style.width = viewport.width + 'px';
          canvas.style.height = viewport.height + 'px';
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          await page.render({canvasContext: ctx, viewport: svp}).promise;
          p.dataset.rendered = '1';
          p.dataset.rendering = '';
          p.dataset.sharp = '0';
          p.dataset.renderedVisible = '1';   // ★ 保持标记
          if(DEVICE.enableSharp){
            scheduleSharpUpgrade(p);
          } else {
            p.dataset.sharp = '1';
            hidePageLoading(p);
          }
        }catch(e){
          console.error('Page render failed (fallback)', e);
          p.dataset.rendering = '';
          hidePageLoading(p);
        }
      }, 0);
    }
  });
}

/* 滚动/停止时，重新触发视口内未升级页面的高清升级 */
function upgradeVisiblePages(){
  if(!DEVICE.enableSharp) return;
  const vh = window.innerHeight;
  pdfList.querySelectorAll('.pdf-page').forEach(p=>{
    if(p.dataset.rendered !== '1') return;   // 还没快速渲染，交给 renderVisiblePages
    if(p.dataset.sharp === '1') return;      // 已经是高清
    if(p.dataset.rendering === '1') return;  // 正在渲染中
    const r = p.getBoundingClientRect();
    // 视口附近（含 300px 预取边距）
    if(r.bottom > -300 && r.top < vh + 300){
      scheduleSharpUpgrade(p);
    }
  });
}


/* 释放远处页面的 canvas 数据（保留占位尺寸） */
function releaseFarCanvas(){
  const vh = window.innerHeight;
  pdfList.querySelectorAll('.pdf-page').forEach(p=>{
    if(p.dataset.rendered !== '1') return;
    const r = p.getBoundingClientRect();
    // 距视口 4000px 以上，释放
    if(r.bottom < -DEVICE.releaseDist || r.top > vh + DEVICE.releaseDist){
      const canvas = p.querySelector('canvas');
      if(canvas && canvas.width > 1){
        canvas.width = 1;
        canvas.height = 1;
        p.dataset.rendered = '';
        p.dataset.sharp = '0';
      }
    }
  });
}

/* 滚动时兜底补渲染（节流 200ms，避免频繁触发）
   滚动停止后再补一次，避免"停下后仍停在低清" */
let lastScroll = 0;
let scrollStopTimer = null;
window.addEventListener('scroll', ()=>{
  const now = Date.now();
  if(now - lastScroll >= 200){
    lastScroll = now;
    renderVisiblePages();
    releaseFarCanvas();
    upgradeVisiblePages();
  }
  // 滚动停止 150ms 后，再补一次（关键：手指离开屏幕那一刻没有新事件也会触发）
  if(scrollStopTimer) clearTimeout(scrollStopTimer);
  scrollStopTimer = setTimeout(()=>{
    renderVisiblePages();
    upgradeVisiblePages();
	updateNavBtns();
  }, 150);
}, {passive:true});

/* 保存当前教材 chip 的位置 */
function saveBookPosition(bookName){
  if(!currentBooks.has(bookName)) return;
  const entry = lastPosition.book.get(bookName) || {};
  if(matchIndex >= 0 && matchCards[matchIndex]){
    entry.matchEl = matchCards[matchIndex].anchorEl || matchCards[matchIndex].pageEl || null;
  }

  const topBarH = document.querySelector('.top-bar').offsetHeight;
  const pages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
    .filter(p=>p.style.display !== 'none');

      entry.pageEl = p;
      entry.pageOffset = r.top - topBarH;   // 页顶相对视口顶(顶栏下沿)的偏移
      break;

/* 保存"全部"视图的位置
   不存 DOM 引用（render 会重建），只存：
   - 最上面可见卡片的"特征文本"（用于恢复时找到同一张卡片）
   - 该卡片顶部相对视口顶(顶栏下沿)的偏移
   - 如果没有卡片（空列表），存 scrollY 兜底 */
function saveAllPosition(){
  const entry = {};
  const topBarH = document.querySelector('.top-bar').offsetHeight;

  // 找"全部"视图里，最靠上且底边超过顶栏下沿的卡片
  const cards = listEl.querySelectorAll('.card');
  for(const c of cards){
    const r = c.getBoundingClientRect();
    if(r.bottom > topBarH + 10){
      const titleEl = c.querySelector('.card-title');
      entry.cardText = titleEl ? titleEl.textContent.trim() : '';
      entry.cardKind = c.dataset.bookName ? 'book'
                     : c.dataset.eqName   ? 'eq'
                     : '';
      entry.cardOffset = r.top - topBarH;   // 卡片顶相对顶栏下沿的偏移
      break;
    }
  }
  // 兜底：记当前 scrollY
  entry.scrollY = window.scrollY;
  lastPosition.book.set('__ALL__', entry);
}

/* 恢复"全部"视图的位置：
   用「卡片特征文本」重新在新列表里找到同一张卡片，定位它 */
function restoreAllPosition(prev){
  if(!prev) return;
  // 等两帧：第一帧让 render() 布局完成，第二帧再滚动
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const topBarH = document.querySelector('.top-bar').offsetHeight;

      // 优先：按 cardText + cardKind 找同一张卡片
      if(prev.cardText){
        const cards = listEl.querySelectorAll('.card');
        for(const c of cards){
          const titleEl = c.querySelector('.card-title');
          const t = titleEl ? titleEl.textContent.trim() : '';
          const kind = c.dataset.bookName ? 'book'
                     : c.dataset.eqName   ? 'eq'
                     : '';
          if(t === prev.cardText && (!prev.cardKind || kind === prev.cardKind)){
            const rect = c.getBoundingClientRect();
            const top = rect.top + window.scrollY - topBarH - (prev.cardOffset || 0);
            window.scrollTo({top: Math.max(0, top), behavior:'auto'});
            return;
          }
        }
      }

      // 兜底：直接还原 scrollY（列表内容变化不大时也够用）
      if(typeof prev.scrollY === 'number'){
        window.scrollTo({top: Math.max(0, prev.scrollY), behavior:'auto'});
      }
    });
  });
}
/* 恢复教材 chip 的位置：有历史 → 只高亮不滚动；返回 true
   注意：恢复滚动位置用 requestAnimationFrame 延后到 DOM 稳定后执行 */
function restoreBookPosition(bookName, prev){
  if(!prev) return false;

  // 1) 优先恢复 matchEl（有关键字时）：只做视觉标记，不滚动
  if(prev.matchEl && matchCards.length > 0){
    const idx = matchCards.findIndex(m =>
      m.anchorEl === prev.matchEl || m.pageEl === prev.matchEl
    );
    if(idx >= 0){
      matchIndex = idx;
      highlightCardNoScroll();
      updateNavBtns();
      return true;
    }
  }

  // 2) 有 pageEl：用页码 + 页内偏移恢复，避免"每次偏一页"
  if(prev.pageEl && prev.pageEl.isConnected){
    const targetPage = prev.pageEl;
    const offset = prev.pageOffset || 0;
    requestAnimationFrame(()=>{
      const topBarH = document.querySelector('.top-bar').offsetHeight;
      const rect = targetPage.getBoundingClientRect();
      const top = rect.top + window.scrollY - topBarH - offset;
      window.scrollTo({top: Math.max(0, top), behavior:'auto'});
	  updateNavBtns(); 
    });
    return true;
  }
  return false;
}

/* ---------- 教材筛选chips ---------- */
function buildChips(){
  chipsEl.innerHTML = '';

  // 把 BOOKS 分成三组：全部 / 教材 / 公式
  const subjectChips = [];   // 教材（导入的文件名）
  const formulaChips = [];   // XX.公式

  BOOKS.forEach(b=>{
    if(b === '全部') return;
    if(b.endsWith('∙公式')) formulaChips.push(b);
    else subjectChips.push(b);
  });

  // 顺序：全部 → 教材 → 公式
  const ordered = ['全部', ...subjectChips, ...formulaChips];

  ordered.forEach(b=>{
    const c = document.createElement('div');
    let isActive = false;

    if(b === '全部'){
      isActive = currentBooks.size === 0 && !showEquations;
    } else if(b.endsWith('∙公式')){
      const subj = b.slice(0, -3);
      isActive = showEquations && eqSubject === subj;
    } else {
      isActive = !showEquations && currentBooks.has(b);
    }

    c.className = 'chip' + (isActive ? ' active' : '');
    c.dataset.book = b;
    c.title = b;
    const label = document.createElement('span');
    label.className = 'chip-label';
    label.textContent = b;
    c.appendChild(label);
    c.onclick = ()=>{
        // ★ 关键词有改动时，先应用草稿（避免切书后还用旧关键词）
        applyDraftIfChanged();
        // ★ 先保存当前位置（仅记录，不参与跳转）
        if(showEquations && eqSubject){
          saveEqPosition();
        } else if(!showEquations && currentBooks.size === 1){
          const curBook = [...currentBooks][0];
          saveBookPosition(curBook);
        } else if(!showEquations && currentBooks.size === 0){
          // 当前在"全部"视图，保存"全部"的位置
          saveAllPosition();
        }

      currentBooks.clear();
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));

      if(b === '全部'){
        showEquations = false;
        eqSubject = '';
        c.classList.add('active');
        render();
        // ★ 恢复"全部"视图上次的位置（restoreAllPosition 内部用双 rAF 等布局稳定）
        const prevAll = lastPosition.book.get('__ALL__');
        if(prevAll) restoreAllPosition(prevAll);
        return;
      }
      if(b.endsWith('∙公式')){
        const subj = b.slice(0, -3);
        showEquations = true;
        eqSubject = subj;
        c.classList.add('active');
        render();   // render() 内部统一处理「有历史→恢复；无历史→默认第一个」
        return;
      }

      // 教材 chip
      showEquations = false;
      eqSubject = '';
      currentBooks.add(b);
      c.classList.add('active');
      render();     // render() 内部统一处理「有历史→恢复；无历史→第一个匹配/第一页」
    };

    // 文档 chip 右侧的小 × ：关闭该文档并释放缓存
    if(b !== '全部' && !b.endsWith('∙公式')){
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'chip-close';
      x.textContent = '×';
      x.title = '关闭「' + b + '」并清空缓存';
      x.setAttribute('aria-label', '关闭 ' + b);
      x.onclick = (ev)=>{
        ev.stopPropagation();
        ev.preventDefault();
        closeBookChip(b);
      };
      c.appendChild(x);
    }

    chipsEl.appendChild(c);
  });
}

    if(hintEl) hintEl.textContent = '按 Enter 开始搜索';

    if(inp.value.trim() === '' && conditions.some(c => (c || '').trim() !== '')){
      commitDraft();
    }
    updateNavBtns();
    scheduleLiveAllCounts();
  };

  if(idx > 0){
    const op = document.createElement('button');
    op.className = 'op-btn ' + (draftCondLogic[idx-1]==='or'?'op-or':'op-and');
    op.textContent = draftCondLogic[idx-1]==='or'?'或':'且';
    op.onclick = ()=>{
      draftCondLogic[idx-1] = draftCondLogic[idx-1]==='or'?'and':'or';
      renderCondArea();
      scheduleLiveAllCounts();

  wrap.appendChild(inp);

  if(idx > 0){
    const del = document.createElement('button');

    };

  }

  return wrap;
}

/* ==================== 关键词扩展 ==================== */
/* 数字 → 下标 */
const SUB_MAP = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
/* 数字 → 上标（用于电荷，如 Fe2+ ↔ Fe²⁺） */
const SUP_DIGIT = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

/* 把字符串里的"数字+/-"整体转成上标：fe2+ → fe²⁺ */
function toSuperCharge(s){
  return s.replace(/(\d+)([+\-])/g, (m, digits, sign) => {
    let out = '';
    for(const d of digits) out += (SUP_DIGIT[d] || d);
    return out + (sign === '+' ? '⁺' : '⁻');
  });
}
/* 反向：把上标数字/正负号还原为普通字符：fe²⁺ → fe2+ */
function fromSuperCharge(s){
  let out = '';
  for(const ch of s){
    let hit = false;
    for(const d in SUP_DIGIT){ if(ch === SUP_DIGIT[d]){ out += d; hit = true; break; } }
    if(hit) continue;
    if(ch === '⁺'){ out += '+'; continue; }
    if(ch === '⁻'){ out += '-'; continue; }
    out += ch;
  }
  return out;
}

/* 数字 ↔ 下标 双向扩展 */
function addSubVariants(set){
  const extra = [];
  set.forEach(kw=>{
    let withSub = kw;
    for(const d in SUB_MAP) withSub = withSub.split(d).join(SUB_MAP[d]);
    if(withSub !== kw) extra.push(withSub);

    let plain = kw;
    for(const d in SUB_MAP) plain = plain.split(SUB_MAP[d]).join(d);
    if(plain !== kw) extra.push(plain);
  });
  extra.forEach(v => set.add(v));
}

/* 电荷上标 ↔ 普通字符 双向扩展（fe2+ ↔ fe²⁺） */
function addChargeVariants(set){
  const extra = [];
  set.forEach(kw=>{
    const sup = toSuperCharge(kw);
    if(sup !== kw) extra.push(sup);
    const plain = fromSuperCharge(kw);
    if(plain !== kw) extra.push(plain);
  });
  extra.forEach(v => set.add(v));
}

/* 通用符号 ↔ 中文 双向扩展 */
function addSymbolVariants(set){
  const extra = [];
  set.forEach(kw=>{
    const kwLower = kw.toLowerCase();
    for(const [sym, zhArr] of Object.entries(SYMBOL_ZH)){
      const symLower = sym.toLowerCase();
      const isAscii = /^[a-z0-9]+$/i.test(symLower);
      const isShortAscii = isAscii && symLower.length === 1;

      /* 符号 → 中文 */
      if(isShortAscii){
        // 单字符 ASCII：仅当 kw 完全等于该符号时才扩展
        if(kwLower === symLower){
          zhArr.forEach(zh => extra.push(zh));
        }
      } else if(kwLower.includes(symLower)){
        zhArr.forEach(zh => extra.push(kwLower.split(symLower).join(zh)));
      }

      /* 中文 → 符号（含去空白后的匹配，处理"大于 等于"这类写法） */
      zhArr.forEach(zh=>{
        const zhLower = zh.toLowerCase();
        if(kwLower.includes(zhLower)){
          extra.push(kwLower.split(zhLower).join(sym));
        }
      });
    }
  });
  extra.forEach(v => { if(v) set.add(v); });
}

/* 综合扩展：中文名 ↔ 化学式、下标 ↔ 数字、电荷上标 ↔ 普通 */
function expandKeyword(kw){
  const set = new Set([kw]);

  /* —— 同义词组扩展 —— */
  const syns = SYNONYM_MAP.get(kw);
  if(syns){
    syns.forEach(v => set.add(v));
  }

  /* 原有的中文 ↔ 化学式 双向扩展 */
  for(const [zh, fSet] of Object.entries(ZH_FORMULA)){
    if(kw.includes(zh)){
      fSet.forEach(f=>{ set.add(kw.split(zh).join(f.toLowerCase())); });
    }
  }

  for(const [f, zh] of Object.entries(FORMULA_ZH)){
    const fLower = f.toLowerCase();
    if(kw.includes(fLower)){
      set.add(kw.split(fLower).join(zh));
    }
  }

  addSubVariants(set);
  addChargeVariants(set);
  addSymbolVariants(set);   // ← 新增

  return [...set];
}
/* ==================== LaTeX 化学式 → Unicode 清理 ==================== */
/* 把 PaddleOCR-VL / MinerU 等识别出的 LaTeX 化学式转为普通文本：
   $Na_{2}O_{2}$     → Na₂O₂
   $\mathrm{Al_2O_3}$ → Al₂O₃
   H_2SO_4            → H₂SO₄
   Fe^{3+}            → Fe³⁺
   \rightarrow        → →
*/
const SUB_REV = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const SUP_REV = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹',
                 '+':'⁺','-':'⁻'};
function toSubUnicode(s){
  let out = '';
  for(const ch of String(s)) out += SUB_REV[ch] || ch;
  return out;
}
function toSupUnicode(s){
  let out = '';
  for(const ch of String(s)) out += SUP_REV[ch] || ch;
  return out;
}

function cleanLatex(s){
  if(!s || typeof s !== 'string') return s;
  // 快速判断：没有 LaTeX 痕迹直接返回（避免无谓处理）
  if(!/[$\\_^{}]/.test(s)) return s;

  // 1. 去掉数学模式包裹
  s = s.replace(/\$\$?/g, '');          // $...$ 和 $$...$$
  s = s.replace(/\\\(|\\\)/g, '');      // \(...\)
  s = s.replace(/\\\[|\\\]/g, '');      // \[...\]

  // 2. 去掉 \mathrm{} \text{} \ce{} \mathbf{} 等（最多处理两层嵌套）
  const wrapRe = /\\(?:mathrm|text|ce|mathbf|mathit|mathsf|operatorname|textrm|mbox)\{([^{}]*)\}/g;
  for(let i=0; i<2; i++) s = s.replace(wrapRe, '$1');

  // 3. 下标/上标：先处理 {...}，再处理单字符
  s = s.replace(/_\{([^{}]*)\}/g, (m, inner) => toSubUnicode(inner));
  s = s.replace(/\^\{([^{}]*)\}/g, (m, inner) => toSupUnicode(inner));
  s = s.replace(/_([0-9A-Za-z+\-])/g, (m, c) => toSubUnicode(c));
  s = s.replace(/\^([0-9A-Za-z+\-])/g, (m, c) => toSupUnicode(c));

  // 4. LaTeX 命令 → Unicode
  const cmdMap = {
    rightarrow:'→', to:'→', longrightarrow:'→', leftarrow:'←', leftrightarrow:'↔',
    Rightarrow:'⇒', Leftrightarrow:'⇌',
    Delta:'Δ', delta:'δ', alpha:'α', beta:'β', gamma:'γ', theta:'θ',
    lambda:'λ', mu:'μ', pi:'π', rho:'ρ', sigma:'σ', phi:'φ', omega:'ω', Omega:'Ω',
    pm:'±', mp:'∓', times:'×', div:'÷', cdot:'·', approx:'≈', neq:'≠',
    le:'≤', ge:'≥', leq:'≤', geq:'≥', infty:'∞', sqrt:'√', sum:'∑',
    uparrow:'↑', downarrow:'↓', quad:' ', qquad:' ',
  };
  s = s.replace(/\\([a-zA-Z]+)/g, (m, name) => cmdMap[name] ?? '');

  // 5. 残留的 LaTeX 空格命令和花括号
  s = s.replace(/\\[,;:! ]/g, '');
  s = s.replace(/[{}]/g, '');
  s = s.replace(/~/g, ' ');

  return s;
}



/* ---------- 匹配逻辑 ---------- */
function matchText(item, kw){
  kw = kw.trim().toLowerCase();
  if(!kw) return true;

  let hay = (item.title + ' ' + item.tags.join(' ') + ' ' + item.content).toLowerCase();
  if(item.exercises && item.exercises.length){
    item.exercises.forEach(ex=>{ hay += ' ' + ex.q + ' ' + ex.a; });
  }

  const variants = expandKeyword(kw);
  return variants.some(v => hay.includes(v));
}
function isMatch(item){
  if(currentBooks.size>0 && !currentBooks.has(item.book)) return false;

  const groups = getConditionGroups();
  if(groups.length === 0) return true;

  // —— 元数据字段的合并文本 ——
  const metaText = [item.book, item.chapter, item.section, item.title]
    .filter(Boolean).join(' ').toLowerCase();
  const matchMeta = w => metaText.includes(w.toLowerCase());

  // 每个关键词：命中正文/标签/习题 或 命中元数据，都算命中
  const matchGroup = words => words.every(w => matchText(item, w) || matchMeta(w));

  let res = matchGroup(groups[0]);
  for(let i=1; i<groups.length; i++){
    const r = matchGroup(groups[i]);
    if(condLogic[i-1] === 'or') res = res || r;
    else                        res = res && r;
  }
  return res;
}


function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightText(text, entries){
  let html = escapeHtml(text);
  [...entries]
    .sort((a,b)=> b.word.length - a.word.length)
    .forEach(({word, colorIndex})=>{
      if(!word) return;
      const esc = word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      html = html.replace(
        new RegExp(esc,'gi'),
        m => `<mark class="hl-${colorIndex % 8}">${m}</mark>`
      );
    });
  return html;
}
function renderLineWithStruct(line, entries){
  const structs = [];
  const PUA_L = '\uE000', PUA_R = '\uE001';

  /* 1. 显式标记 [=xxx=] */
  line = line.replace(/\[=([^\[\]]+?)=\]/g, (m, key) => {
    const svg = STRUCT_SVG[key.trim()];
    if(svg){
      structs.push(svg);
      return PUA_L + 'S' + (structs.length - 1) + PUA_R;
    }
    return m;
  });

  /* 2. 自动追加：每次命中都追加，不去重 */
  if(AUTO_RE){
    AUTO_RE.lastIndex = 0;
    line = line.replace(AUTO_RE, (matched) => {
      const svg = AUTO_MAP[matched];
      if(!svg) return matched;
      structs.push(svg);
      return matched + PUA_L + 'S' + (structs.length - 1) + PUA_R;
    });
  }

  /* 3. 关键词高亮（entries 是 {word, colorIndex} 数组） */
  let html = highlightText(line, entries) || '';

  /* 4. 占位符还原为内联结构式 */
  html = html.replace(/\uE000S(\d+)\uE001/g, (m, i) => {
    const svg = structs[+i];
    return svg ? `<span class="struct-inline">${svg}</span>` : '';
  });

  return html;
}

function getConditionGroups(){
  return conditions
    .map(c => (c || '').trim())
    .filter(c => c.length > 0)
    .map(c => [c]);
}

function getHighlightEntries(){
  const entries = [];
  let colorIndex = 0;
  conditions.forEach(c => {
    const words = c.trim().split(/\s+/).filter(Boolean);
    words.forEach(w => {
      expandKeyword(w.toLowerCase()).forEach(v => {
        if(v) entries.push({ word: v, colorIndex });
      });
      colorIndex++;
    });
  });
  return entries;
}

/* ---------- 展开/收起答案时的滚动锚定 ---------- */
function withScrollAnchor(doToggle){
  const topBarH = document.querySelector('.top-bar').offsetHeight;
  const midY = (topBarH + window.innerHeight) / 2;

  let anchor = null;
  const cards = listEl.querySelectorAll('.card');
  for(const c of cards){
    const r = c.getBoundingClientRect();
    if(r.top <= midY && r.bottom >= midY){ anchor = c; break; }
  }
  if(!anchor){
    for(const c of cards){
      if(c.getBoundingClientRect().top > topBarH + 2){ anchor = c; break; }
    }
  }
  if(!anchor){ doToggle(); return; }

  const before = anchor.getBoundingClientRect().top;
  doToggle();
  const after = anchor.getBoundingClientRect().top;
  const diff = after - before;
  if(diff) window.scrollBy(0, diff);
}

/* ---------- 方程式视图渲染 ---------- */
function renderEqText(line, entries){
  const conds = [];
  let raw = line.replace(/=([^=]+)=/g, (m, cond) => {
    conds.push(cond);
    return '\uE000C' + (conds.length - 1) + '\uE001';
  });
  let html = (entries && entries.length) ? highlightText(raw, entries) : escapeHtml(raw);
  html = html.replace(/\uE000C(\d+)\uE001/g, (m, i) => {
    const cond = conds[+i];
    const condHtml = (entries && entries.length) ? highlightText(cond, entries) : escapeHtml(cond);
    return '<span class="eq-arrow"><span class="eq-cond">' + condHtml + '</span><span class="eq-symbol">=</span></span>';
  });
  return html;
}

function normalizeEqGroups(arr){
  if(!arr || !arr.length) return [];
  // 已是 [{group, items}] 格式
  if(arr[0] && Array.isArray(arr[0].items)) return arr;
  // 旧格式 [{title, chem, ion}] → 包成单组
  return [{ items: arr.map(x => ({ t:x.title, c:x.chem, i:x.ion, note:x.note })) }];
}
function makeEqCard(title, groups, metaText){
  const entries = getHighlightEntries();

  const card = document.createElement('div');
  card.className = 'card';

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <div class="card-head-left">
      <div class="card-title">${entries.length ? highlightText(title, entries) : escapeHtml(title)}</div>
      ${metaText ? `<div class="card-meta">${escapeHtml(metaText)}</div>` : ''}
    </div>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
  `;
  head.onclick = ()=>{ card.classList.toggle('open'); };

  const body = document.createElement('div');
  body.className = 'card-body';

  const content = document.createElement('div');
  content.className = 'card-content';

  groups.forEach(g=>{
    const gDiv = document.createElement('div');
    gDiv.className = 'eq-group';

    if(g.group){
      const gt = document.createElement('div');
      gt.className = 'eq-group-title';
      gt.innerHTML = entries.length ? highlightText(g.group, entries) : escapeHtml(g.group);
      gDiv.appendChild(gt);
    }

    (g.items || []).forEach(itRaw=>{
      const it = {
        t: itRaw.t || itRaw.title || '',
        c: itRaw.c || itRaw.chem || '',
        i: itRaw.i || itRaw.ion || '',
        note: itRaw.note
      };
      const item = document.createElement('div');
      item.className = 'eq-item';

      let html = `<div class="eq-name">${renderLineWithStruct(it.t, entries)}</div>`;
      if(it.c){
        it.c.split('\n').forEach(line=>{
          html += `<div class="eq-line">${renderEqText(line, entries)}</div>`;
        });
      }
      if(it.i){
        it.i.split('\n').forEach(line=>{
          html += `<div class="eq-line ion">${renderEqText(line, entries)}</div>`;
        });
      }
      if(it.note){
        html += `<div class="card-meta" style="margin-top:4px">${escapeHtml(it.note)}</div>`;
      }
      item.innerHTML = html;
      gDiv.appendChild(item);
    });

    content.appendChild(gDiv);
  });

  body.appendChild(content);
  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function eqItemMatches(it, entries){
  if(!entries.length) return true;
  const t = it.t || it.title || '';
  const c = it.c || it.chem || '';
  const i = it.i || it.ion || '';
  const hay = (t + ' ' + c + ' ' + i).toLowerCase();
  return entries.some(e => e.word && hay.includes(e.word));
}

    }
  }

  // 2. 各科目卡片
  Object.entries(EQ_DATA).forEach(([book, rawGroups])=>{

function renderAll(){

          const n = normalizeForMatch(v);
          if(n) s.add(n);
        });
      });
      return [...s].sort((a,b)=>b.length-a.length);
    });
    const flatVariants = groupVariants.flat();

  // 变体按长度降序排列，避免长变体（如 na2o2）被短变体（如 na）
  // 重复计数；同时去重。
  const orderedVariants = [...new Set(flatVariants)]
    .filter(Boolean)
    .sort((a,b) => b.length - a.length);

  allPages.forEach(pageEl=>{
    const book = pageEl.dataset.book || '未命名';

    // 懒构建 normText（首次访问时从文本层计算）

    // ★ 统计本页内的"匹配处数"，而不是"是否有匹配"
    // 逐个变体扫描，命中后把该段替换成等长占位符，
    // 避免被后续更短的变体重复计入。
    let scratch = pageText;

    for(const v of orderedVariants){
      let pos = 0;
      while((pos = scratch.indexOf(v, pos)) !== -1){
        hits++;
        scratch = scratch.slice(0, pos)
                + '\u0000'.repeat(v.length)
                + scratch.slice(pos + v.length);
        pos += v.length;
      }

    if(hits === 0) return;

    bookMap.set(book, (bookMap.get(book) || 0) + hits);

} else if(hasKeyword){

  {

/* ==================== “全部”视图：输入时实时更新各卡片匹配数 ==================== */
/* 只做预览：临时用草稿条件重算列表，再恢复已提交条件；不会滚动或跳转。 */
function isAllView(){
  return !showEquations && eqSubject === '' && currentBooks.size === 0;
}

function captureAllPreviewAnchor(){
  const topBarH = document.querySelector('.top-bar').offsetHeight;
  const cards = listEl.querySelectorAll('.card');
  for(const c of cards){
    const r = c.getBoundingClientRect();
    if(r.bottom > topBarH + 10){
      return {
        bookName: c.dataset.bookName || '',
        eqName: c.dataset.eqName || '',
        cardText: (c.querySelector('.card-title')?.textContent || '').trim(),
        offset: r.top - topBarH,
        scrollY: window.scrollY
      };
    }
  }
  return { scrollY: window.scrollY };
}

function restoreAllPreviewAnchor(anchor){
  if(!anchor) return;
  const topBarH = document.querySelector('.top-bar').offsetHeight;
  if(anchor.bookName || anchor.eqName || anchor.cardText){
    for(const c of listEl.querySelectorAll('.card')){
      const title = (c.querySelector('.card-title')?.textContent || '').trim();
      const same = (anchor.bookName && c.dataset.bookName === anchor.bookName) ||
                   (anchor.eqName && c.dataset.eqName === anchor.eqName) ||
                   (!anchor.bookName && !anchor.eqName && anchor.cardText && title === anchor.cardText);
      if(same){
        const r = c.getBoundingClientRect();
        const top = r.top + window.scrollY - topBarH - (anchor.offset || 0);
        window.scrollTo({top: Math.max(0, top), behavior: 'auto'});
        return;
      }
    }
  }
  if(typeof anchor.scrollY === 'number'){
    window.scrollTo({top: Math.max(0, anchor.scrollY), behavior: 'auto'});
  }
}

function scheduleLiveAllCounts(){
  const token = ++livePreviewToken;
  if(livePreviewTimer) clearTimeout(livePreviewTimer);
  livePreviewTimer = setTimeout(()=>{
    livePreviewTimer = null;
    if(token !== livePreviewToken) return;
    if(!draftHasChanges() || !isAllView()) return;
    if(!listEl || listEl.style.display === 'none') return;

    const savedConditions = conditions;
    const savedLogic = condLogic;
    const anchor = captureAllPreviewAnchor();
    try{
      conditions = draftConditions.slice();
      condLogic = draftCondLogic.slice();
      renderAll();
    }catch(err){
      console.warn('实时更新匹配数失败：', err);
    }finally{
      conditions = savedConditions;
      condLogic = savedLogic;
    }
    if(token === livePreviewToken) restoreAllPreviewAnchor(anchor);
    // 预览时临时条件会让 draftHasChanges() 变成 false，恢复后重新同步导航按钮
    updateNavBtns();
  }, 180);
}

function highlightSvgText(container, entries){
  const texts = container.querySelectorAll('text');
  texts.forEach(t => {
    const raw = (t.textContent || '').toLowerCase();
    let matched = false;
    for(const e of entries){
      const w = (typeof e === 'string')
        ? e
        : (e && (e.text || e.value || e.keyword || e.w)) || '';
      if(!w) continue;
      if(raw.includes(w.toLowerCase())){
        matched = true;
        break;
      }
    }
    if(matched){
      t.classList.add('svg-hit');
      const svg = t.closest('svg');
      if(svg) svg.classList.add('svg-hit-container');
    }
  });
}

    if(shouldActive) x.classList.add('active');

} else {

/* ---------- PDF / TXT 搜索高亮（精确关键词高亮 + 多色 + 页级过滤） ---------- */
function normalizeForMatch(s){
  if(!s) return '';
  s = cleanLatex(String(s));
  return s.toLowerCase().replace(/[\s\u3000]+/g, '');
}

function highlightPdfMatches(){
  // 清空旧 overlay
  pdfList.querySelectorAll('.hl-overlay').forEach(o=>o.remove());
  document.querySelectorAll('.hl-rect.active-hit').forEach(e=>e.classList.remove('active-hit'));
  document.querySelectorAll('.txt-line.active-hit').forEach(e=>e.classList.remove('active-hit'));
  document.querySelectorAll('.txt-line').forEach(l=>{
    const t = l.querySelector('.hl-txt');
    if(t){ l.textContent = l.textContent; }  // 复原
  });

  matchCards = [];
  matchIndex = -1;

  // 页级过滤：按当前教材选中过滤
  const pageContainers = pdfList.querySelectorAll('.pdf-page, .txt-doc');
  pageContainers.forEach(p=>{
    const book = p.dataset.book;
    const visible = currentBooks.size === 0 || !book || currentBooks.has(book);
    p.style.display = visible ? '' : 'none';
  });

  const groups = getConditionGroups();
  if(groups.length === 0){
    countEl.textContent = pdfPageCount ? `共 ${pdfPageCount} 页` : `共 ${searchSpans.length} 行`;
    hintEl.textContent = '输入关键词开始搜索';
    updateNavBtns();
    return;
  }

  // 每个搜索框 → 变体集合
  const groupVariants = groups.map(g=>{
    const s = new Set();
    g.forEach(w=>{
      expandKeyword(w.toLowerCase()).forEach(v=>{
        const n = normalizeForMatch(v);
        if(n) s.add(n);
      });
    });
    return [...s].sort((a,b)=>b.length-a.length);
  });

  // 先做页级快速筛选：整页都不含任何变体的页直接跳过
  const flatVariants = groupVariants.flat();
  pageContainers.forEach(pageEl=>{
    if(pageEl.style.display === 'none') return;

	let pageText = pageEl.dataset.normText;
	if(!pageText){
	  const tl = pageEl.querySelector('.text-layer');
	  const raw = tl ? (tl.textContent || '') : (pageEl.textContent || '');
	  pageText = normalizeForMatch(raw);
	  pageEl.dataset.normText = pageText;
	}
    if(pageText){
      // 该页不含任何变体 → 直接跳过（快速路径）
      const anyHit = flatVariants.some(v => v && pageText.includes(v));
      if(!anyHit) return;
    }
    processPageForSearch(pageEl, groupVariants);
  });

  // 换关键词时：优先定位到"当前页或之后"的第一个匹配（视觉标记，不滚动）
  if(matchCards.length){
    const curPage = getCurrentVisiblePage();
    if(curPage){
      let idx = matchCards.findIndex(m => pageOfMatch(m) === curPage);
      if(idx < 0){
        // 当前页无匹配 → 向后找当前页之后的第一个匹配
        const allPages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
          .filter(p => p.style.display !== 'none');
        const curIdx = allPages.indexOf(curPage);
        if(curIdx >= 0){
          for(let i = curIdx + 1; i < allPages.length; i++){
            const nIdx = matchCards.findIndex(m => pageOfMatch(m) === allPages[i]);
            if(nIdx >= 0){ idx = nIdx; break; }
          }
        }
      }
      // 若往后一直到末尾都没匹配（即匹配都在当前页之前），保持 -1
      // 让用户按 ↓ 时从第 0 项开始，按 ↑ 时无响应——符合直觉
      if(idx >= 0){
        matchIndex = idx;
        highlightCardNoScroll();
      }
    }
  }

  countEl.textContent = `共 ${matchCards.length} 处匹配`;
  hintEl.textContent = matchCards.length ? '点击 ↑↓ 或 ‹› 跳转' : '未找到匹配';
  updateNavBtns();
}

/* 在单页里查找并按"短语"作为一次匹配注册 */
function processPageForSearch(pageEl, groupVariants){
  const textLayer = pageEl.querySelector('.text-layer');
  const txtDoc = pageEl.classList.contains('txt-doc') ? pageEl : null;

  if(txtDoc){
    processTxtDocForSearch(txtDoc, groupVariants);
    return;
  }
  if(!textLayer) return;

  // 收集 textNode
  const walker = document.createTreeWalker(textLayer, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      if(node.parentElement && node.parentElement.closest('.hl-overlay')) return NodeFilter.FILTER_REJECT;
      return node.textContent && node.textContent.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const textNodes = [];
  let nn;
  while((nn = walker.nextNode())) textNodes.push(nn);
  if(!textNodes.length) return;

  // 构建归一化文本 + 位置映射
  const entries = [];
  let fullNorm = '';
  for(const node of textNodes){
    const raw = node.nodeValue || '';
    const normToRaw = [];
    let norm = '';
    for(let i=0;i<raw.length;i++){
      const ch = raw[i];
      if(/\s/.test(ch) || ch === '\u3000') continue;
      normToRaw.push(i);
      norm += ch.toLowerCase();
    }
    if(norm.length){
      entries.push({node, norm, normToRaw, startInFull: fullNorm.length});
      fullNorm += norm;
    }
  }
  if(!fullNorm) return;

  // 找所有匹配
  const allMatches = [];
  groupVariants.forEach((variants, gIdx)=>{
    variants.forEach(v=>{
      if(!v) return;
      let pos = 0;
      while((pos = fullNorm.indexOf(v, pos)) !== -1){
        allMatches.push({start: pos, end: pos + v.length, group: gIdx});
        pos += v.length;
      }
    });
  });
  if(!allMatches.length) return;

  // ★ 按位置排序，让同页内不同关键词按出现顺序混合
  allMatches.sort((a, b) => a.start - b.start || a.group - b.group);

  // 页级 AND/OR
  const groupHits = groupVariants.map((_, i)=> allMatches.some(m => m.group === i));
  let ok = groupHits[0];
  for(let i=1;i<groupHits.length;i++){
    if(condLogic[i-1]==='or') ok = ok || groupHits[i];
    else ok = ok && groupHits[i];
  }
  if(!ok) return;

  // 准备 overlay
  let overlay = textLayer.querySelector('.hl-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'hl-overlay';
    textLayer.appendChild(overlay);
  }

  const z = parseFloat(pdfList.style.zoom || 1) || 1;
  const layerRect = textLayer.getBoundingClientRect();

  // 为每个匹配生成 rect
  allMatches.forEach(m=>{
    const r = rangeFromNorm(entries, m.start, m.end);
    if(!r) return;
    let rects;
    try{
      const range = document.createRange();
      range.setStart(r.startNode, r.startOffset);
      range.setEnd(r.endNode, r.endOffset);
      rects = range.getClientRects();
    }catch(e){ return; }
    if(!rects.length) return;

    const rectEls = [];
    for(const rect of rects){
      if(rect.width < 0.5 || rect.height < 0.5) continue;
      const div = document.createElement('div');
      div.className = 'hl-rect hit-g' + (m.group % 8);
      div.style.left = ((rect.left - layerRect.left) / z) + 'px';
      div.style.top  = ((rect.top  - layerRect.top ) / z) + 'px';
      div.style.width  = (rect.width  / z) + 'px';
      div.style.height = (rect.height / z) + 'px';
      overlay.appendChild(div);
      rectEls.push(div);
    }
    if(rectEls.length){
      matchCards.push({
        pageEl,
        rectEls,
        anchorEl: rectEls[0],
        group: m.group,
      });
    }
  });
}

/* 归一化位置 → DOM Range */
function rangeFromNorm(entries, startNorm, endNorm){
  let acc = 0;
  let s = null, e = null;
  for(const entry of entries){
    const eLen = entry.norm.length;
    if(s === null && acc + eLen > startNorm){
      s = {node: entry.node, offset: entry.normToRaw[startNorm - acc]};
    }
    if(acc + eLen >= endNorm){
      const localEnd = endNorm - acc;
      if(localEnd <= 0){
        e = {node: entry.node, offset: 0};
      } else {
        e = {node: entry.node, offset: entry.normToRaw[localEnd - 1] + 1};
      }
      break;
    }
    acc += eLen;
  }
  if(!s || !e) return null;
  return {startNode: s.node, startOffset: s.offset, endNode: e.node, endOffset: e.offset};
}

/* TXT 精确高亮：使用 <span class="hl-txt"> 包裹匹配文字 */
function processTxtDocForSearch(txtDoc, groupVariants){
  const lines = Array.from(txtDoc.querySelectorAll('.txt-line'));
  if(!lines.length) return;

  const lineData = lines.map(l=>{
    const raw = l.textContent || '';
    const normToRaw = [];
    let norm = '';
    for(let i=0;i<raw.length;i++){
      const ch = raw[i];
      if(/\s/.test(ch) || ch === '\u3000') continue;
      normToRaw.push(i);
      norm += ch.toLowerCase();
    }
    return {line: l, raw, norm, normToRaw};
  });
  const fullNorm = lineData.map(d=>d.norm).join('');
  if(!fullNorm) return;

  const allMatches = [];
  groupVariants.forEach((variants, gIdx)=>{
    variants.forEach(v=>{
      if(!v) return;
      let pos = 0;
      while((pos = fullNorm.indexOf(v, pos)) !== -1){
        allMatches.push({start: pos, end: pos + v.length, group: gIdx});
        pos += v.length;
      }
    });
  });
  if(!allMatches.length) return;

  // ★ 按位置排序，让同页内不同关键词按出现顺序混合
  allMatches.sort((a, b) => a.start - b.start || a.group - b.group);

  const groupHits = groupVariants.map((_, i)=> allMatches.some(m => m.group === i));
  let ok = groupHits[0];
  for(let i=1;i<groupHits.length;i++){
    if(condLogic[i-1]==='or') ok = ok || groupHits[i];
    else ok = ok && groupHits[i];
  }
  if(!ok) return;

  // 计算每行的全局起始 norm 位置
  let acc = 0;
  lineData.forEach(d=>{ d.startInFull = acc; acc += d.norm.length; });

  // 对每行：重建 DOM 内容，用 hl-txt 包裹匹配片段
  lineData.forEach(d=>{
    const raw = d.raw;
    const lineStart = d.startInFull;
    const lineEnd = lineStart + d.norm.length;

    // 该行内所有匹配片段（基于 norm 位置）
    const localHits = [];
    allMatches.forEach(m=>{
      const s = Math.max(m.start, lineStart);
      const e = Math.min(m.end, lineEnd);
      if(s >= e) return;
      localHits.push({
        rawStart: d.normToRaw[s - lineStart],
        rawEnd:   d.normToRaw[e - lineStart - 1] + 1,
        group: m.group,
        normStart: s,
        normEnd: e,
      });
    });
    if(!localHits.length) return;

    localHits.sort((a,b)=>a.rawStart - b.rawStart);
    // 合并同一行重叠区间（保留第一个组的颜色）
    const merged = [];
    localHits.forEach(h=>{
      const last = merged[merged.length-1];
      if(last && h.rawStart <= last.rawEnd){
        last.rawEnd = Math.max(last.rawEnd, h.rawEnd);
      } else {
        merged.push({...h});
      }
    });

    // 重建行 DOM
    let html = '';
    let cursor = 0;
    merged.forEach(h=>{
      html += escapeHtml(raw.slice(cursor, h.rawStart));
      html += `<span class="hl-txt hit-g${h.group % 8}" data-group="${h.group}">` +
              escapeHtml(raw.slice(h.rawStart, h.rawEnd)) + '</span>';
      cursor = h.rawEnd;
    });
    html += escapeHtml(raw.slice(cursor));
    d.line.innerHTML = html;

    // 每条匹配注册到 matchCards（以第一个 hl-txt 作为 anchor）
    merged.forEach(h=>{
      const el = d.line.querySelectorAll('.hl-txt')[merged.indexOf(h)];
      if(!el) return;
      matchCards.push({
        pageEl: txtDoc,
        rectEls: [el],
        anchorEl: el,
        group: h.group,
      });
    });
  });
}

/* ---------- 导航按钮 ---------- */
function pageOfMatch(m){
  if(m instanceof Element){
    return m.closest('.pdf-page, .txt-doc, .card');
  }
  return m.pageEl || null;
}

function updateNavBtns(){
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  const prevPage = document.getElementById('prevPageBtn');
  const nextPage = document.getElementById('nextPageBtn');
  if(!prev || !next) return;

  const hasMatch = matchCards.length > 0;
  const draftDirty = draftHasChanges();
  if(draftDirty){
    // 关键词有改动时，四个导航键都先提交再按新结果跳转
    prev.disabled = false;
    next.disabled = false;
    if(prevPage) prevPage.disabled = false;
    if(nextPage) nextPage.disabled = false;
    return;
  }
  if(!hasMatch){
    prev.disabled = true;
    next.disabled = true;
    if(prevPage) prevPage.disabled = true;
    if(nextPage) nextPage.disabled = true;
    return;
  }

  const isCardView = (listEl.style.display !== 'none');
  let canPrev = false, canNext = false;

  if(isCardView){
    // 卡片视图：按 matchCards 顺序
    canPrev = matchIndex > 0;
    canNext = matchIndex < matchCards.length - 1;
  } else if(matchIndex < 0){
    // PDF/TXT 视图，尚未定位到匹配项：两个方向都允许
    canPrev = true;
    canNext = true;
  } else {
    // PDF/TXT 视图，已有匹配项：检查是否在视口内
    let curAbove = false, curBelow = false;
    const m = matchCards[matchIndex];
    const a = m && m.anchorEl;
    if(a && a.isConnected){
      const r = a.getBoundingClientRect();
      const topBarH = document.querySelector('.top-bar').offsetHeight;
      const vh = window.innerHeight;
      curAbove = r.bottom <= topBarH;   // 匹配项在视口上方（被顶栏遮住）
      curBelow = r.top >= vh;            // 匹配项在视口下方
    }
    // 有更早/更晚的匹配项，或当前匹配项在视口外 → 允许朝它跳转
    canPrev = matchIndex > 0 || curAbove;
    canNext = matchIndex < matchCards.length - 1 || curBelow;
  }

  prev.disabled = !canPrev;
  next.disabled = !canNext;

  if(prevPage && nextPage){
    const cur = matchIndex >= 0 ? pageOfMatch(matchCards[matchIndex]) : null;
    const allPages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
      .filter(p=>p.style.display !== 'none');
    const curIdx = cur ? allPages.indexOf(cur) : -1;
    const pageHasMatch = p => matchCards.some(m => pageOfMatch(m) === p);
    let hasPrev = false, hasNext = false;
    if(curIdx === -1){
      hasPrev = hasNext = hasMatch;
    } else {
      for(let i=curIdx-1;i>=0;i--) if(pageHasMatch(allPages[i])){ hasPrev = true; break; }
      for(let i=curIdx+1;i<allPages.length;i++) if(pageHasMatch(allPages[i])){ hasNext = true; break; }
    }
    prevPage.disabled = !hasPrev;
    nextPage.disabled = !hasNext;
  }
  // 草稿有新关键词：允许直接点导航（内部会先提交）
  if(draftDirty){
    prev.disabled = false;
    next.disabled = false;
    if(prevPage) prevPage.disabled = false;
    if(nextPage) nextPage.disabled = false;
  }
}

/* ↑ / ↓：按"匹配"前后跳（在当前文档全部匹配里走） */
document.getElementById('prevBtn').onclick = ()=>handleNav(-1);
document.getElementById('nextBtn').onclick = ()=>handleNav(1);
/* ↑↑ / ↓↓：按"页"跳（跳到上一页/下一页有匹配的页，并定位到该页第一个/最后一个匹配） */
document.getElementById('prevPageBtn').onclick = ()=>handlePageNav(-1);
document.getElementById('nextPageBtn').onclick = ()=>handlePageNav(1);
/* ==================== 键盘热键 ====================
   Enter / ↓ = 下一个匹配
   ↑         = 上一个匹配
   ← / →     = 上一页 / 下一页
   在关键词输入框内同样有效；按住 Shift + 方向键可正常移动光标。
   焦点在按钮/链接上时，Enter 保留原生点击行为。
=================================================== */
document.addEventListener('keydown', (e)=>{
  if(e.defaultPrevented) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.shiftKey) return;            // 让 Shift+方向键 在输入框里选字
  if(e.isComposing) return;         // 中文输入法组词中

  const key = e.key;
  let act = '';
  if(key === 'Enter')            act = 'next';
  else if(key === 'ArrowUp')     act = 'prev';
  else if(key === 'ArrowDown')   act = 'next';
  else if(key === 'ArrowLeft')   act = 'prevPage';
  else if(key === 'ArrowRight')  act = 'nextPage';
  if(!act) return;

  const t = e.target;
  // 焦点在按钮/链接上时，Enter 留给它自己（打开文件、安装等）
  if(key === 'Enter' && t && t.closest && t.closest('button, a, [role="button"], select, textarea')) return;

  e.preventDefault();
  if(act === 'next')          handleNav(1);
  else if(act === 'prev')     handleNav(-1);
  else if(act === 'nextPage') handlePageNav(1);
  else if(act === 'prevPage') handlePageNav(-1);
});

/* 找「当前视口内 或 视口下方」最近的匹配（用于 ↓） */
function findMatchInOrBelowViewport(){
  const topBarH = document.querySelector('.top-bar').offsetHeight;
  for(let i = 0; i < matchCards.length; i++){
    const a = matchCards[i].anchorEl;
    if(!a || !a.isConnected) continue;
    const r = a.getBoundingClientRect();
    // 匹配底部在顶栏下沿之下 → 至少部分在视口内或在下方
    if(r.bottom > topBarH) return i;
  }
  return -1;
}

/* 找「当前视口内 或 视口上方」最近的匹配（用于 ↑） */
function findMatchInOrAboveViewport(){
  const vh = window.innerHeight;
  for(let i = matchCards.length - 1; i >= 0; i--){
    const a = matchCards[i].anchorEl;
    if(!a || !a.isConnected) continue;
    const r = a.getBoundingClientRect();
    // 匹配顶部在视口下沿之上 → 至少部分在视口内或在上方
    if(r.top < vh) return i;
  }
  return -1;
}

/* 草稿是否和已提交状态不同 */
function draftHasChanges(){
  if(draftConditions.length !== conditions.length) return true;
  for(let i = 0; i < draftConditions.length; i++){
    if(draftConditions[i] !== conditions[i]) return true;
  }
  if(draftCondLogic.length !== condLogic.length) return true;
  for(let i = 0; i < draftCondLogic.length; i++){
    if(draftCondLogic[i] !== condLogic[i]) return true;
  }
  return false;
}

/* 只把草稿写入已提交状态（不重绘、不跳转） */
function applyDraftIfChanged(){
  if(!draftHasChanges()) return false;
  conditions = draftConditions.slice();
  condLogic  = draftCondLogic.slice();
  // 关键词变了 → 之前记录的高亮元素引用失效，只保留页码
  lastPosition.book.forEach(v => { v.matchEl = null; });
  lastPosition.eq.forEach(v => { v.matchEl = null; });
  return true;
}

/* 提交草稿（执行搜索），但不自动跳转 */
function commitDraft(){
  const changed = applyDraftIfChanged();
  suppressAutoJump = true;
  skipRestoreOnNextRender = true;
  render();
  skipRestoreOnNextRender = false;
  suppressAutoJump = false;
  return changed;
}

/* 记录提交新关键词前的页面锚点：新搜索从当前页开始 */
function capturePageSearchAnchor(){
  if(!pdfList || pdfList.style.display === 'none') return null;
  const pages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
    .filter(p=>p.style.display !== 'none');
  if(!pages.length) return null;
  const page = getCurrentVisiblePage();
  return { page, pageIndex: page ? pages.indexOf(page) : -1 };
}

/* 在重新生成的 matchCards 里，找当前页（或之后/之前）的第一个匹配 */
function matchIndexFromPageAnchor(anchor, dir){
  if(!matchCards.length) return -1;
  if(anchor){
    const pages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
      .filter(p=>p.style.display !== 'none');
    let base = -1;
    if(anchor.page && anchor.page.isConnected) base = pages.indexOf(anchor.page);
    if(base < 0) base = anchor.pageIndex;
    if(base >= 0){
      if(dir > 0){
        // ↓ / Enter：从当前页的第一个匹配开始；当前页没有就往后找
        for(let i=0;i<matchCards.length;i++){
          const pi = pages.indexOf(pageOfMatch(matchCards[i]));
          if(pi >= base) return i;
        }
      } else {
        // ↑：从当前页的最后一个匹配开始；当前页没有就往前找
        for(let i=matchCards.length-1;i>=0;i--){
          const pi = pages.indexOf(pageOfMatch(matchCards[i]));
          if(pi >= 0 && pi <= base) return i;
        }
      }
    }
  }
  return dir > 0 ? 0 : matchCards.length - 1;
}

/* 提交草稿并把首次跳转锚定在“当前页”，而不是固定回到第 1 页 */
function jumpToDraftAnchor(dir){
  const anchor = capturePageSearchAnchor();
  commitDraft();
  if(matchCards.length > 0){
    let idx = matchIndexFromPageAnchor(anchor, dir);
    if(idx < 0) idx = dir > 0 ? 0 : matchCards.length - 1;
    matchIndex = idx;
    highlightCard();
    const bn = currentBooks.size === 1 ? [...currentBooks][0] : '';
    if(bn) saveBookPosition(bn);
  }
}

/* ★ 导航按钮统一入口：先提交（如果需要），再跳转 */
function handleNav(dir){
  if(draftHasChanges()){
    jumpToDraftAnchor(dir);
    return;
  }
  jumpByMatch(dir);
}

/* ← / →：先提交草稿，再按页跳转 */
function handlePageNav(dir){
  if(draftHasChanges()){
    jumpToDraftAnchor(dir);
    return;
  }
  jumpByPage(dir);
}

/* ↑ / ↓：在 matchCards 序列里前后跳 */
function jumpByMatch(dir){
  if(!matchCards.length) return;

  // 卡片视图（公式 / 教材）：直接按 matchCards 顺序跳
  if(listEl.style.display !== 'none'){
    const next = matchIndex + dir;
    if(next >= 0 && next < matchCards.length){
      matchIndex = next;
      highlightCard();
    }
    return;
  }

  // PDF/TXT 视图
  if(matchIndex < 0 || matchIndex >= matchCards.length){
    matchIndex = dir > 0 ? 0 : matchCards.length - 1;
    highlightCard();
    return;
  }

  // ★ 用户手动滚动检测：看「当前匹配元素」是否还在视口内。
  //   程序平滑滚动期间不做检测，避免中间态误判。
  if(!isSmoothScrolling){
    const anchor = matchCards[matchIndex].anchorEl;
    const topBarH = document.querySelector('.top-bar').offsetHeight;
    const vh = window.innerHeight;
    let inView = false;
    if(anchor && anchor.isConnected){
      const r = anchor.getBoundingClientRect();
      // 留 30px 余量，避免边缘抖动
      inView = r.bottom > topBarH - 30 && r.top < vh + 30;
    }
    if(!inView){
      // 用户滑走了 → 直接跳到「视口内或方向前方最近的匹配」
      const idx = dir > 0
        ? findMatchInOrBelowViewport()
        : findMatchInOrAboveViewport();
      if(idx >= 0){
        matchIndex = idx;
        highlightCard();
      }
      // 找不到匹配 → 什么都不做，绝不回退
      return;
    }
  }

  // 正常 ±1（连续按 ↓/↑ 时不再受"当前页"干扰）
  const next = matchIndex + dir;
  if(next >= 0 && next < matchCards.length){
    matchIndex = next;
    highlightCard();
  }
}


/* ↑↑ / ↓↓：直接跳到上/下一个"有匹配的页"，并定位到该页首/尾匹配 */
function jumpByPage(dir){
  if(!matchCards.length) return;

  // 卡片视图（公式 / 教材）：
  //   - 公式视图：matchCards 是 .eq-item 列表 → ↑↑/↓↓ 跳到上/下一张 .card
  //   - 教材视图（"全部"）：matchCards 本身就是 .card → 直接 ±1
  if(listEl.style.display !== 'none'){
    if(matchIndex < 0 || matchIndex >= matchCards.length){
      matchIndex = dir > 0 ? 0 : matchCards.length - 1;
      highlightCard();
      return;
    }
    const cur = matchCards[matchIndex];
    // 如果是 eq-item（公式视图），先找到它所属的卡片
    if(cur instanceof Element && cur.classList.contains('eq-item')){
      const curCard = cur.closest('.card');
      if(curCard){
        // 拿到全部卡片（只算列表里当前的 .card）
        const allCards = Array.from(listEl.querySelectorAll('.card'));
        const cardIdx = allCards.indexOf(curCard);
        if(cardIdx >= 0){
          const nextCard = allCards[cardIdx + dir];
          if(nextCard){
            // 找这张卡片里第一个/最后一个 .eq-item
            const items = Array.from(nextCard.querySelectorAll('.eq-item'));
            if(items.length){
              const target = dir > 0 ? items[0] : items[items.length - 1];
              const idx = matchCards.indexOf(target);
              if(idx >= 0){
                matchIndex = idx;
                highlightCard();
                return;
              }
            }
          }
          // 没有下一张卡片了 → 什么都不做
          return;
        }
      }
    }
    // 教材视图（matchCards 就是 .card）：直接 ±1
    const next = matchIndex + dir;
    if(next >= 0 && next < matchCards.length){
      matchIndex = next;
      highlightCard();
    }
    return;
  }

  // PDF/TXT 视图
  const allPages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
    .filter(p=>p.style.display !== 'none');
  if(!allPages.length) return;

  // ★ 基线优先用 matchIndex 所在页（上次定位的页，稳定）
  //   只有 matchIndex 无效时，才退回用"当前可见页"
  let baseIdx = -1;
  if(matchIndex >= 0 && matchIndex < matchCards.length){
    const p = pageOfMatch(matchCards[matchIndex]);
    if(p) baseIdx = allPages.indexOf(p);
  }
  if(baseIdx < 0){
    const curVisible = getCurrentVisiblePage();
    if(curVisible) baseIdx = allPages.indexOf(curVisible);
  }
  if(baseIdx < 0){
    matchIndex = dir > 0 ? 0 : matchCards.length - 1;
    highlightCard();
    return;
  }

  // 从下一页/上一页开始，找第一页有匹配的
  let t = baseIdx + dir;
  while(t >= 0 && t < allPages.length){
    const page = allPages[t];
    const pageMatchIdxs = [];
    for(let i=0;i<matchCards.length;i++){
      if(pageOfMatch(matchCards[i]) === page) pageMatchIdxs.push(i);
    }
    if(pageMatchIdxs.length){
      // ↓↓ 定位到该页第一个匹配；↑↑ 定位到该页最后一个匹配
      matchIndex = dir > 0 ? pageMatchIdxs[0] : pageMatchIdxs[pageMatchIdxs.length-1];
      highlightCard();
      return;
    }
    t += dir;
  }
  // 到头了，什么都不做
}


/* 当前视口中第一个可见的页面（跳过顶栏遮挡） */
function getCurrentVisiblePage(){
  const topBarH = document.querySelector('.top-bar').offsetHeight;
  const vh = window.innerHeight;
  const pages = [...pdfList.querySelectorAll('.pdf-page, .txt-doc')]
    .filter(p => p.style.display !== 'none');
  let best = null, bestVisible = 0;
  for(const p of pages){
    const r = p.getBoundingClientRect();
    // 取页面在“顶栏以下、视口以内”的可见高度；上一页露出的几像素不算当前页
    const visible = Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, topBarH));
    if(visible > bestVisible){
      bestVisible = visible;
      best = p;
    }
  }
  return best || pages[pages.length - 1] || null;
}

/* 只做视觉标记，不滚动 */
function highlightCardNoScroll(){
  document.querySelectorAll('.hl-rect.active-hit').forEach(e=>e.classList.remove('active-hit'));
  document.querySelectorAll('.txt-line.active-hit').forEach(e=>e.classList.remove('active-hit'));
  if(matchIndex < 0 || matchIndex >= matchCards.length) return;
  const m = matchCards[matchIndex];
  if(!m || !m.rectEls) return;
  m.rectEls.forEach(el=>el.classList.add('active-hit'));
  const line = m.anchorEl && m.anchorEl.closest && m.anchorEl.closest('.txt-line');
  if(line) line.classList.add('active-hit');
}

/* ==================== 跳转辅助 ==================== */

/* 跳到指定教材 chip，并定位到第一个匹配 */
function jumpToBookChip(bookName){
  const chip = [...document.querySelectorAll('.chip')].find(x => (x.dataset.book || x.textContent) === bookName);
  if(chip){
    chip.click();   // chip 里已经处理"有记录就恢复，没记录就默认"
  } else {
    showEquations = false;
    eqSubject = '';
    currentBooks.clear();
    currentBooks.add(bookName);
    render();
    setTimeout(()=>{
      if(matchCards.length > 0){
        matchIndex = 0;
        highlightCard();
      }
    }, 200);
  }
}

/* 跳到指定公式卡片所属的学科 chip。
   - 若该学科已有历史位置 → 交给 render()+restoreEqPosition 恢复（不强行展开卡片）
   - 否则 → 展开该卡片，定位到第一个匹配 */
function jumpToEqCard(eqName){
  const subj = getSubjectOfKey(eqName);
  const chipName = subj + '∙公式';
  const chip = [...document.querySelectorAll('.chip')].find(x => (x.dataset.book || x.textContent) === chipName);

  // 如果当前不在同一学科，先保存当前位置
  if(showEquations && eqSubject && eqSubject !== subj){
    saveEqPosition();
  }

  const prev = lastPosition.eq.get(subj);
  const hasHistory = !!(prev && prev.matchEl && prev.matchEl.isConnected);

  if(chip){
    chip.click();   // chip 的 onclick → render() → restoreEqPosition（若有历史）
  } else {
    showEquations = true;
    eqSubject = subj;
    render();
  }

  // 只有「没有历史位置」时，才主动展开卡片并定位到该卡片第一个匹配
  if(hasHistory) return;

  setTimeout(()=>{
    const targetCard = [...listEl.querySelectorAll('.card')].find(c=>{
      const t = c.querySelector('.card-title');
      return t && t.textContent.trim() === eqName;
    });
    if(!targetCard) return;
    targetCard.classList.add('open');
    const firstItem = targetCard.querySelector('.eq-item');
    if(firstItem){
      document.querySelectorAll('.eq-item.active-eq-item').forEach(x=>x.classList.remove('active-eq-item'));
      firstItem.classList.add('active-eq-item');
      const idx = matchCards.indexOf(firstItem);
      if(idx >= 0){
        matchIndex = idx;
        highlightCardNoScroll();   // 不滚动，避免又跳走
      }
    }
    updateNavBtns();
  }, 200);
}

/* 平滑滚动到指定位置；若浏览器/隐藏页面不支持平滑滚动，则自动改用瞬时跳转 */
function smoothScrollToY(top){  const target = Math.max(0, Math.round(top));
  const start = window.scrollY;
  if(Math.abs(target - start) < 2) return;
  beginSmoothScroll();
  try{
    window.scrollTo({top: target, behavior: 'smooth'});
  }catch(e){
    window.scrollTo(0, target);
  }
  setTimeout(()=>{
    if(Math.abs(window.scrollY - start) < 2 && Math.abs(target - start) > 4){
      window.scrollTo(0, target);
      isSmoothScrolling = false;
    }
    updateNavBtns();
  }, 520);
}

/* scrollIntoView 的兜底版：平滑滚动失效时，强制把元素滚进视口 */
function scrollIntoViewReliable(el, block){
  if(!el || !el.scrollIntoView) return;
  const inView = ()=>{
    const r = el.getBoundingClientRect();
    const topBarH = document.querySelector('.top-bar').offsetHeight;
    return r.bottom > topBarH && r.top < window.innerHeight;
  };
  try{
    el.scrollIntoView({behavior: 'smooth', block: block || 'start'});
  }catch(e){
    try{ el.scrollIntoView(true); }catch(_){}
  }
  setTimeout(()=>{
    if(!inView()){
      try{ el.scrollIntoView({block: block || 'start'}); }catch(e){}
    }
    updateNavBtns();
  }, 480);
}

function highlightCard(){
  // 清空旧高亮
  document.querySelectorAll('.hl-rect.active-hit').forEach(e=>e.classList.remove('active-hit'));  document.querySelectorAll('.txt-line.active-hit').forEach(e=>e.classList.remove('active-hit'));
  document.querySelectorAll('.card.active-card').forEach(e=>{
    e.classList.remove('active-card'); e.style.boxShadow = '';
  });
  /* ★ 新增：清空方程式条目高亮 */
  document.querySelectorAll('.eq-item.active-eq-item').forEach(e=>{
    e.classList.remove('active-eq-item');
  });

  if(matchIndex < 0 || matchIndex >= matchCards.length) return;
  const m = matchCards[matchIndex];
  if(!m) return;
  // 教材匹配：展开所属卡片，高亮该条目，点亮该 chip
  if(m instanceof Element){
    // ★ 卡片（教材 or 公式）→ 跳转到对应 chip，并定位到该 chip 内第一个匹配
    if(m.classList.contains('card')){
      const bookName = m.dataset.bookName;
      const eqName   = m.dataset.eqName;
      scrollIntoViewReliable(m, 'start');
      m.style.boxShadow = '0 0 0 3px #1B5E20';
      setTimeout(()=>{ m.style.boxShadow = ''; }, 800);

      if(bookName){
        // 教材卡片 → 跳到该教材 chip，定位到第一个匹配页
        jumpToBookChip(bookName);
      } else if(eqName){
        // 公式卡片 → 跳到对应学科 chip，定位到该卡片内第一个匹配
        jumpToEqCard(eqName);
      }
      return;
    }
    // 方程式条目（公式视图内）
    if(m.classList.contains('eq-item')){
      const card = m.closest('.card');
      if(card) card.classList.add('open');
      m.classList.add('active-eq-item');
      scrollIntoViewReliable(m, 'center');
    } else {
      m.classList.add('active-card');
      m.style.boxShadow = '0 0 0 3px #1B5E20';
      m.classList.add('open');
      scrollIntoViewReliable(m, 'start');
    }
} else if(m.rectEls){
  // PDF overlay 高亮
  m.rectEls.forEach(el=>el.classList.add('active-hit'));
  const topBarH = document.querySelector('.top-bar').offsetHeight;
  const rect = m.anchorEl.getBoundingClientRect();
  const top = rect.top + window.scrollY - topBarH - window.innerHeight * 0.35;
  smoothScrollToY(top);
  // TXT：给所在行加 active-hit 类
  const line = m.anchorEl.closest && m.anchorEl.closest('.txt-line');
  if(line) line.classList.add('active-hit');
}
  updateNavBtns();
}




/* ---------- SVG 放大 ---------- */
const svgOverlay = document.getElementById('svgZoomOverlay');
const svgZoomBox = document.getElementById('svgZoomBox');

document.addEventListener('click', (e)=>{
  if(!e.target.closest) return;
  const svg = e.target.closest('svg');
  if(!svg) return;

  const inStruct = svg.closest('.struct-inline');
  const inSvgLine = svg.closest('.svg-line');
  if(!inStruct && !inSvgLine) return;

  e.stopPropagation();

  const vb = svg.viewBox && svg.viewBox.baseVal;
  let vw = (vb && vb.width)  || 0;
  let vh = (vb && vb.height) || 0;
  if(!vw || !vh){
    const r = svg.getBoundingClientRect();
    vw = r.width  || 300;
    vh = r.height || 150;
  }

  const padX  = 40;
  const padY  = 40;
  const hintH = 46;
  const maxW  = window.innerWidth  * 0.9 - padX;
  const maxH  = window.innerHeight * 0.9 - padY - hintH;

  const scale  = Math.min(maxW / vw, maxH / vh);
  const finalW = Math.max(40, Math.round(vw * scale));
  const finalH = Math.max(40, Math.round(vh * scale));

  const clone = svg.cloneNode(true);
  clone.removeAttribute('class');
  clone.setAttribute('width',  finalW);
  clone.setAttribute('height', finalH);
  clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  clone.style.cssText =
    'display:block;width:' + finalW + 'px;height:' + finalH +
    'px;max-width:none;max-height:none;';

  svgZoomBox.innerHTML =
    '<div class="svg-zoom-inner"></div>' +
    '<div class="zoom-hint">点击空白处关闭</div>';
  svgZoomBox.querySelector('.svg-zoom-inner').appendChild(clone);
  svgOverlay.classList.add('show');
});

svgZoomBox.onclick = (e)=> e.stopPropagation();
svgOverlay.onclick = ()=> svgOverlay.classList.remove('show');

/* ==================== 文件导入（PDF / Word / Excel / PPT / 图片 / TXT，累积导入 + 去重） ==================== */
(function(){

  /* ---- 记住上次导入位置（Chromium 桌面端 best-effort） ----
     浏览器不允许网页读写完整路径；这里把上次选择的 FileSystemFileHandle
     存进 IndexedDB，下次用 showOpenFilePicker({startIn}) 从它所在目录打开。
     Safari / iOS / Firefox / 安卓 Chrome 不支持时，自动回退到普通 <input type=file>，
     此时由系统文件选择器自己决定是否记住上次目录。 */
  const PICKER_DB = 'kesou-prefs';
  const PICKER_STORE = 'handles';
  const PICKER_KEY = 'lastImport';
  let lastPickerHandle = null;

  function openPickerDB(){
    return new Promise((resolve, reject)=>{
      if(!('indexedDB' in window)) return reject(new Error('IndexedDB 不可用'));
      const req = indexedDB.open(PICKER_DB, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(PICKER_STORE)){
          db.createObjectStore(PICKER_STORE);
        }
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error || new Error('IndexedDB 打开失败'));
    });
  }
  function loadLastPickerHandle(){
    return openPickerDB().then(db=>new Promise(resolve=>{
      const tx = db.transaction(PICKER_STORE, 'readonly');
      const rq = tx.objectStore(PICKER_STORE).get(PICKER_KEY);
      rq.onsuccess = ()=>resolve(rq.result || null);
      rq.onerror = ()=>resolve(null);
      tx.oncomplete = ()=>{ try{ db.close(); }catch(e){} };
    })).catch(()=>null);
  }
  function saveLastPickerHandle(handle){
    return openPickerDB().then(db=>new Promise((resolve, reject)=>{
      const tx = db.transaction(PICKER_STORE, 'readwrite');
      tx.objectStore(PICKER_STORE).put(handle, PICKER_KEY);
      tx.oncomplete = ()=>{ try{ db.close(); }catch(e){}; resolve(); };
      tx.onerror = ()=>{ try{ db.close(); }catch(e){}; reject(tx.error); };
    })).catch(()=>{});
  }
  loadLastPickerHandle().then(handle=>{
    lastPickerHandle = handle;
  }).catch(()=>{});

  const PICKER_TYPES = [
    {description:'PDF', accept:{'application/pdf':['.pdf']}},
    {description:'Word / 文本', accept:{
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx'],
      'application/msword':['.doc'],
      'application/rtf':['.rtf'],
      'application/epub+zip':['.epub'],
      'application/vnd.oasis.opendocument.text':['.odt'],
      'text/plain':['.txt','.md','.markdown','.csv','.tsv','.json','.log'],
      'text/html':['.html','.htm']
    }},
    {description:'Excel', accept:{
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],
      'application/vnd.ms-excel':['.xls'],
      'application/vnd.ms-excel.sheet.binary.macroEnabled.12':['.xlsb'],

    {description:'PPT', accept:{
      'application/vnd.openxmlformats-officedocument.presentationml.presentation':['.pptx'],

  async function pickWithFileSystemAccess(){
    const opts = {

  /* 已导入文件去重表：key = 文件名 + 大小 */

/* ---- 缩放：同步重排后立即补偿滚动 ---- */
  /* ---- 缩放：同步测量 + 同步补偿 ---- */
  let zoomTimer = null;

  function currentZoomTarget(){
    if(pdfList && pdfList.style.display !== 'none') return pdfList;
    return listEl;
  }

  function applyZoom(newZoom, anchorClientX, anchorClientY, light){
    const target = currentZoomTarget();
    if(!target) return;

    const oldZoom = pdfZoom;
    const targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, +(+newZoom).toFixed(2)));
    if(Math.abs(targetZoom - oldZoom) < 0.001) return;

    const vw = document.documentElement.clientWidth;
    const vh = window.innerHeight;
    const ax = (typeof anchorClientX === 'number') ? anchorClientX : vw / 2;
    const ay = (typeof anchorClientY === 'number') ? anchorClientY : vh / 2;

    const rectBefore = target.getBoundingClientRect();
    const localX = (ax - rectBefore.left) / oldZoom;
    const localY = (ay - rectBefore.top)  / oldZoom;

    pdfZoom = targetZoom;
    target.style.zoom = targetZoom;

    const rectAfter = target.getBoundingClientRect();
    const newAx = rectAfter.left + localX * targetZoom;
    const newAy = rectAfter.top  + localY * targetZoom;

    const dx = newAx - ax;
    const dy = newAy - ay;
    if(dx || dy) window.scrollBy(dx, dy);

    if(target === pdfList && !light){
      pdfList.querySelectorAll('.pdf-page').forEach(p => { p.dataset.sharp = '0'; });
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(() => {
        renderVisiblePages();
        upgradeVisiblePages();
      }, 120);
    }

    updateZoomBtns();
  }

 
 
  gZoomInBtn.addEventListener('click', ()=>{ applyZoom(pdfZoom + 0.2); });
  gZoomOutBtn.addEventListener('click', ()=>{ applyZoom(pdfZoom - 0.2); });

/* ---- 双指缩放：rAF 节流 + 轻量提交 ---- */
let pinchStart = 0, pinchBaseZoom = 1;
let pinchActive = false;
let pinchRafId = null;
let pinchPendingZoom = null;
let pinchPendingCx = 0, pinchPendingCy = 0;

function flushPinchZoom(){
  pinchRafId = null;
  if(pinchPendingZoom == null) return;
  const z = pinchPendingZoom, cx = pinchPendingCx, cy = pinchPendingCy;
  pinchPendingZoom = null;
  applyZoom(z, cx, cy, true);   // 轻量
}

document.addEventListener('touchstart', e=>{
  if(e.touches.length === 2 && currentZoomTarget()){
    pinchStart = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchBaseZoom = pdfZoom;
    pinchActive = true;
    if(pinchRafId){ cancelAnimationFrame(pinchRafId); pinchRafId = null; }
    pinchPendingZoom = null;
    e.preventDefault();
  }
}, {passive:false});

document.addEventListener('touchmove', e=>{
  if(e.touches.length === 2 && pinchActive){
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const rawRatio = dist / pinchStart;
    const dampedRatio = 1 + (rawRatio - 1) * 0.45;
    pinchPendingZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchBaseZoom * dampedRatio));
    pinchPendingCx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinchPendingCy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if(!pinchRafId) pinchRafId = requestAnimationFrame(flushPinchZoom);
    e.preventDefault();
  }
}, {passive:false});

document.addEventListener('touchend', e=>{
  if(pinchActive && e.touches.length < 2){
    pinchActive = false;
    if(pinchRafId){ cancelAnimationFrame(pinchRafId); pinchRafId = null; }
    if(pinchPendingZoom != null){
      const z = pinchPendingZoom, cx = pinchPendingCx, cy = pinchPendingCy;
      pinchPendingZoom = null;
      applyZoom(z, cx, cy, true);
    }
    // 松手后统一重渲一次
    if(pdfList){
      pdfList.querySelectorAll('.pdf-page').forEach(p => { p.dataset.sharp = '0'; });
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(() => {
        renderVisiblePages();
        upgradeVisiblePages();
      }, 100);
    }
  }
});

  /* ============ 教材检测（严格识别）============ */
  function detectBookName(text, filename){
    const fn = (filename || '').replace(/\.[^.]+$/, '').replace(/\s+/g, '');
    const ct = (text || '').replace(/\s+/g, '');

    const subjects = [
      '化学','物理','数学','生物','地理','历史','政治','道德与法治','思想品德',
      '语文','英语','信息技术','通用技术','科学','美术','音乐','体育'
    ];

    // 科目
    let subject = '';
    for(const s of subjects){ if(fn.includes(s)){ subject = s; break; } }
    if(!subject){
      for(const s of subjects){ if(ct.includes(s)){ subject = s; break; } }
    }

    // 模块（必修/选择性必修/选修 + 序号，支持"第一册""选必一"等写法）
    function findModule(str){
      let m = str.match(/选择性必修\s*第?\s*([一二三四五12345])/) ||
              str.match(/选必\s*第?\s*([一二三四五12345])/);
      if(m) return '选必' + m[1];
      m = str.match(/必修\s*第?\s*([一二三四五12345])/);
      if(m) return '必修' + m[1];
      m = str.match(/选修\s*第?\s*([一二三四五12345])/);
      if(m) return '选修' + m[1];
      return '';
    }
    let module = '';
    const fnModule = findModule(fn);
    if(fnModule) module = fnModule;
    else {
      const ctModule = findModule(ct);
      if(ctModule) module = ctModule;
    }

    // 年级（小学/初中，如"三年级""八年级"）
    let grade = '';
    const gm = fn.match(/([一二三四五六七八九]年级)/) || ct.match(/([一二三四五六七八九]年级)/);
    if(gm) grade = gm[0];

    // 严格：必须同时有 subject 和 (module 或 grade) 才算教科书
    if(!subject) return null;
    if(module) return subject + module;
    if(grade)  return subject + grade;
    return null;
  }
